<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0F;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }

        /* ============================================
           КАРТОЧКА TELEGRAM — ГОЛУБАЯ
           ============================================ */
        .telegram-card {
            width: 100%;
            max-width: 440px;
            height: 200px;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            display: flex;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(0, 180, 255, 0.08);
        }
        .telegram-card:hover {
            transform: scale(1.02);
            box-shadow: 
                0 25px 70px rgba(0, 0, 0, 0.9),
                0 0 60px rgba(0, 180, 255, 0.15);
        }
        .telegram-card:active {
            transform: scale(0.97);
        }

        /* ============================================
           ЛЕВАЯ ЧАСТЬ — 35% (ПЕРСОНАЖ)
           ============================================ */
        .telegram-card .artwork {
            width: 35%;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            background: #0A0A1A;
            z-index: 1;
        }

        /* Сложный градиентный фон с голубым свечением */
        .telegram-card .artwork .bg-glow {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 50% 90%, rgba(0, 150, 255, 0.5) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 50%, rgba(80, 200, 255, 0.2) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 20%, rgba(0, 120, 220, 0.3) 0%, transparent 50%),
                linear-gradient(180deg, #08081A 0%, #0A1A2A 40%, #05051A 100%);
            z-index: 0;
        }

        /* Частицы */
        .telegram-card .artwork .particles {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .telegram-card .artwork .particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(100, 200, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(100, 200, 255, 0.2);
            animation: floatParticle 4s infinite ease-in-out;
        }
        .telegram-card .artwork .particles span:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; width: 3px; height: 3px; }
        .telegram-card .artwork .particles span:nth-child(2) { left: 60%; top: 15%; animation-delay: 1.2s; width: 5px; height: 5px; opacity: 0.5; }
        .telegram-card .artwork .particles span:nth-child(3) { left: 30%; top: 70%; animation-delay: 2.5s; width: 4px; height: 4px; }
        .telegram-card .artwork .particles span:nth-child(4) { left: 70%; top: 60%; animation-delay: 0.8s; width: 3px; height: 3px; opacity: 0.3; }
        .telegram-card .artwork .particles span:nth-child(5) { left: 10%; top: 85%; animation-delay: 1.8s; width: 6px; height: 6px; opacity: 0.2; }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-20px) scale(1.5); opacity: 0.8; }
        }

        /* Изображение персонажа */
        .telegram-card .artwork .character {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 105%;
            object-fit: contain;
            object-position: bottom center;
            z-index: 2;
            filter: drop-shadow(0 10px 30px rgba(0, 150, 255, 0.3));
        }

        /* Правая градиентная маска для плавного перехода */
        .telegram-card .artwork .edge-mask {
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(10, 10, 26, 0.9) 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* ============================================
           ПРАВАЯ ЧАСТЬ — 65% (КОНТЕНТ)
           ============================================ */
        .telegram-card .content {
            flex: 1;
            padding: 20px 22px 18px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, #0D0D1A 0%, #0A1A2A 40%, #0A0A1A 100%);
            position: relative;
            z-index: 1;
        }

        /* Тонкий голубой отлив на правой части */
        .telegram-card .content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 0% 50%, rgba(0, 150, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 100% 20%, rgba(80, 200, 255, 0.04) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .telegram-card .content > * {
            position: relative;
            z-index: 1;
        }

        /* Логотип TELEGRAM PREMIUM */
        .telegram-card .content .logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
            margin-bottom: 2px;
        }
        .telegram-card .content .logo .telegram {
            font-size: 1.7rem;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            font-family: 'Helvetica Neue', system-ui, sans-serif;
            text-shadow: 0 2px 20px rgba(255, 255, 255, 0.05);
        }
        .telegram-card .content .logo .premium {
            font-size: 1.7rem;
            font-weight: 900;
            color: #5BC8FF;
            letter-spacing: -0.5px;
            margin-top: -4px;
            font-family: 'Helvetica Neue', system-ui, sans-serif;
            text-shadow: 0 0 30px rgba(91, 200, 255, 0.2);
        }

        /* Список возможностей */
        .telegram-card .content .features {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 8px 0 6px;
        }
        .telegram-card .content .features .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.2px;
        }
        .telegram-card .content .features .feature .icon-placeholder {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .telegram-card .content .features .feature .icon-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Разделитель */
        .telegram-card .content .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(91, 200, 255, 0.15) 0%, rgba(91, 200, 255, 0.03) 100%);
            margin: 4px 0 8px;
        }

        /* Нижняя строка */
        .telegram-card .content .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .telegram-card .content .bottom-row .price-group {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .telegram-card .content .bottom-row .price-group .donat-label {
            font-size: 0.55rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .telegram-card .content .bottom-row .price-group .price {
            font-size: 1.3rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .telegram-card .content .bottom-row .arrow {
            color: rgba(255, 255, 255, 0.15);
            font-size: 1.4rem;
            font-weight: 300;
            transition: all 0.2s;
        }
        .telegram-card:hover .content .bottom-row .arrow {
            color: rgba(255, 255, 255, 0.4);
            transform: translateX(4px);
        }

        /* ============================================
           АДАПТИВНОСТЬ
           ============================================ */
        @media (max-width: 480px) {
            .telegram-card {
                height: 175px;
                border-radius: 24px;
            }
            .telegram-card .content {
                padding: 16px 18px 14px 16px;
            }
            .telegram-card .content .logo .telegram,
            .telegram-card .content .logo .premium {
                font-size: 1.4rem;
            }
            .telegram-card .content .features .feature {
                font-size: 0.6rem;
                gap: 8px;
            }
            .telegram-card .content .features .feature .icon-placeholder {
                width: 14px;
                height: 14px;
            }
            .telegram-card .content .bottom-row .price-group .price {
                font-size: 1.1rem;
            }
            .telegram-card .content .bottom-row .arrow {
                font-size: 1.2rem;
            }
            .telegram-card .artwork .character {
                height: 100%;
                width: 100%;
            }
        }

        @media (max-width: 380px) {
            .telegram-card {
                height: 155px;
                border-radius: 20px;
            }
            .telegram-card .content {
                padding: 14px 14px 12px 14px;
            }
            .telegram-card .content .logo .telegram,
            .telegram-card .content .logo .premium {
                font-size: 1.2rem;
            }
            .telegram-card .content .features .feature {
                font-size: 0.55rem;
                gap: 6px;
            }
            .telegram-card .content .features .feature .icon-placeholder {
                width: 12px;
                height: 12px;
            }
            .telegram-card .content .bottom-row .price-group .price {
                font-size: 1rem;
            }
            .telegram-card .content .bottom-row .arrow {
                font-size: 1rem;
            }
            .telegram-card .content .divider {
                margin: 2px 0 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
         КАРТОЧКА TELEGRAM — ГОЛУБАЯ
         ============================================ -->
    <div class="telegram-card" onclick="alert('Переход в раздел Telegram')">

        <!-- ЛЕВАЯ ЧАСТЬ — 35% -->
        <div class="artwork">
            <div class="bg-glow"></div>
            
            <!-- Частицы -->
            <div class="particles">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Изображение персонажа (Imgur) -->
            <img class="character" 
                 src="https://i.imgur.com/eM5u3Td.png" 
                 alt="Telegram Character"
                 loading="lazy">

            <!-- Маска перехода -->
            <div class="edge-mask"></div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ — 65% -->
        <div class="content">
            <!-- Логотип -->
            <div class="logo">
                <span class="telegram">TELEGRAM</span>
                <span class="premium">PREMIUM</span>
            </div>

            <!-- Возможности -->
            <div class="features">
                <div class="feature">
                    <span class="icon-placeholder">
                        <img src="https://i.imgur.com/star-icon.png" alt="Stars"
                             onerror="this.style.display='none'">
                    </span>
                    Stars
                </div>
                <div class="feature">
                    <span class="icon-placeholder">
                        <img src="https://i.imgur.com/premium-icon.png" alt="Premium"
                             onerror="this.style.display='none'">
                    </span>
                    Premium
                </div>
                <div class="feature">
                    <span class="icon-placeholder">
                        <img src="https://i.imgur.com/gift-icon.png" alt="Gifts"
                             onerror="this.style.display='none'">
                    </span>
                    Подарки
                </div>
            </div>

            <!-- Разделитель -->
            <div class="divider"></div>

            <!-- Нижняя строка -->
            <div class="bottom-row">
                <div class="price-group">
                    <span class="donat-label">Донат от</span>
                    <span class="price">79 ₽</span>
                </div>
                <span class="arrow">→</span>
            </div>
        </div>
    </div>

</body>
</html>

// Экран Пополнения
const TopUpScreen = ({ onBack, onTopUp }) => {
  const [amount, setAmount] = useState(500);
  const [customAmount, setCustomAmount] = useState('');
  const [method, setMethod] = useState('sbp');
  const [isSuccess, setIsSuccess] = useState(false);
  const [error, setError] = useState('');

  const presets = [100, 250, 500, 1000, 2500];

  const handleSelectPreset = (val) => {
    setAmount(val);
    setCustomAmount('');
  };

  const handleCustomChange = (e) => {
    const val = e.target.value;
    setCustomAmount(val);
    if (val && parseInt(val) > 0) {
      setAmount(parseInt(val));
    }
  };

  const handleSubmit = () => {
    if (!amount || amount <= 0) return;
    setIsSuccess(true);
    setTimeout(() => {
      onTopUp(amount, method);
      onBack();
    }, 1200);
  };

  if (isSuccess) {
    return (
      <div className="flex flex-col items-center justify-center py-16 text-center animate-fadeIn my-auto">
        <CheckCircle className="w-16 h-16 text-emerald-400 mb-4 animate-bounce" />
        <h3 className="text-xl font-bold text-white mb-2">Баланс пополнен!</h3>
        <p className="text-xs text-white/50">Зачислено {amount.toLocaleString('ru-RU')} ₽</p>
      </div>
    );
  }

  return (
    <div className="flex flex-col w-full h-full min-h-0 justify-between animate-fadeIn overflow-hidden">
      <div className="flex items-center gap-3 mb-4 shrink-0">
        <button
          type="button"
          onClick={onBack}
          className="w-9 h-9 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white cursor-pointer transition-all active:scale-95"
        >
          <ArrowLeft className="w-4 h-4" />
        </button>
        <div>
          <h2 className="text-lg font-extrabold text-white">Пополнение баланса</h2>
          <p className="text-[11px] text-white/40">Выберите сумму и способ оплаты</p>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto space-y-4 pr-0.5 min-h-0">
        <div>
          <label className="text-[10px] font-semibold text-white/50 mb-1.5 block uppercase tracking-wider">
            Быстрый выбор суммы
          </label>
          <div className="grid grid-cols-5 gap-1.5 mb-2">
            {presets.map((p) => (
              <button
                key={p}
                type="button"
                onClick={() => handleSelectPreset(p)}
                className={`py-2 rounded-xl border text-xs font-semibold transition-all cursor-pointer ${
                  amount === p && !customAmount
                    ? 'bg-indigo-600/30 border-indigo-500 text-white shadow-md'
                    : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'
                }`}
              >
                {p} ₽
              </button>
            ))}
          </div>
          <input
            type="number"
            placeholder="Своя сумма (₽)"
            value={customAmount}
            onChange={handleCustomChange}
            className="w-full bg-white/5 border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition-colors [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
          />
        </div>

        <div>
          <label className="text-[10px] font-semibold text-white/50 mb-1.5 block uppercase tracking-wider">
            Способ оплаты
          </label>
          <div className="space-y-2">
            {[
              { id: 'sbp', label: 'СБП (Система быстрых платежей)', icon: <Smartphone className="w-3.5 h-3.5 text-emerald-400" /> },
              { id: 'card', label: 'Банковская карта (Мир, Visa, MC)', icon: <CreditCard className="w-3.5 h-3.5 text-indigo-400" /> },
              { id: 'stars', label: 'Telegram Stars', icon: <Send className="w-3.5 h-3.5 text-sky-400" /> },
              { id: 'crypto', label: 'Криптовалюта (TON, USDT)', icon: <Zap className="w-3.5 h-3.5 text-amber-400" /> },
            ].map((m) => (
              <button
                key={m.id}
                type="button"
                onClick={() => setMethod(m.id)}
                className={`w-full flex items-center justify-between p-2.5 rounded-xl border text-xs font-semibold transition-all cursor-pointer ${
                  method === m.id
                    ? 'bg-indigo-600/20 border-indigo-500 text-white shadow-md'
                    : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'

                <div className="flex items-center gap-2.5">
                  {m.icon}
                  <span>{m.label}</span>
                </div>
                <div
                  className={`w-3.5 h-3.5 rounded-full border flex items-center justify-center ${
                    method === m.id ? 'border-indigo-500 bg-indigo-500' : 'border-white/20'

      </div>
    </div>
  );
};

const WithdrawScreen = ({ userBalance, onBack, onWithdraw }) => {
  const [method, setMethod] = useState('sbp');
  const [amount, setAmount] = useState('');
  const [phone, setPhone] = useState('+7 (999) 000-00-00');
  const [selectedBank, setSelectedBank] = useState('Сбер');
  const [isCustomBank, setIsCustomBank] = useState(false);
  const [customBank, setCustomBank] = useState('');
  const [cardNumber, setCardNumber] = useState('');
  const [error, setError] = useState('');
  const [isSuccess, setIsSuccess] = useState(false);

  const numAmount = parseInt(amount) || 0;
  const fee = Math.round(numAmount * 0.03 * 100) / 100;
  const finalAmount = Math.max(0, Math.round((numAmount - fee) * 100) / 100);

  const formatPhoneInput = (val) => {
    if (!val) return '+7 ';
    let cleaned = val.trim();
    if (cleaned.startsWith('+')) {
      let digits = cleaned.replace(/[^\d+]/g, '');
      if (digits.startsWith('+7') || digits.startsWith('+8')) {
        let nums = digits.replace(/\D/g, '');
        if (nums.startsWith('7') || nums.startsWith('8')) nums = nums.substring(1);
        let res = '+7';
        if (nums.length > 0) res += ' (' + nums.substring(0, 3);
        if (nums.length >= 3) res += ') ' + nums.substring(3, 6);
        if (nums.length >= 6) res += '-' + nums.substring(6, 8);
        if (nums.length >= 8) res += '-' + nums.substring(8, 10);
        return res;
      } else {
        return cleaned;
      }
    } else {
      let nums = cleaned.replace(/\D/g, '');
      if (nums.startsWith('8') || nums.startsWith('7')) {
        nums = nums.substring(1);
      }
      let res = '+7';
      if (nums.length > 0) res += ' (' + nums.substring(0, 3);
      if (nums.length >= 3) res += ') ' + nums.substring(3, 6);
      if (nums.length >= 6) res += '-' + nums.substring(6, 8);
      if (nums.length >= 8) res += '-' + nums.substring(8, 10);
      return res;
    }
  };

  const formatCardInput = (val) => {
    const digits = val.replace(/\D/g, '').substring(0, 16);
    let formatted = '';
    for (let i = 0; i < digits.length; i++) {
      if (i > 0 && i % 4 === 0) formatted += ' ';
      formatted += digits[i];
    }
    return formatted;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!numAmount || numAmount < 50) {
      setError('Минимальная сумма вывода 50 ₽');
      return;
    }
    if (numAmount > userBalance) {
      setError(`Недостаточно средств. Баланс: ${userBalance.toLocaleString('ru-RU')} ₽`);
      return;
    }

    let details = '';
    if (method === 'sbp') {
      if (phone.replace(/\D/g, '').length < 10) {
        setError('Укажите корректный номер телефона (не менее 10 цифр)');
        return;
      }
      const bankToUse = isCustomBank ? customBank.trim() : selectedBank;
      if (!bankToUse) {
        setError('Укажите название банка получателя');
        return;
      }
      details = `СБП: ${phone}, ${bankToUse}`;
    } else {
      if (cardNumber.replace(/\s/g, '').length < 16) {
        setError('Укажите 16-значный номер карты');
        return;
      }
      details = `Карта: ${cardNumber}`;
    }

    setError('');
    setIsSuccess(true);
    setTimeout(() => {
      onWithdraw(numAmount, details);
      onBack();
    }, 1400);
  };

  if (isSuccess) {
    return (
      <div className="flex flex-col items-center justify-center py-16 text-center animate-fadeIn my-auto">
        <CheckCircle className="w-16 h-16 text-indigo-400 mb-4 animate-bounce" />
        <h3 className="text-xl font-bold text-white mb-2">Заявка отправлена!</h3>
        <p className="text-xs text-white/50">Запрос на {numAmount.toLocaleString('ru-RU')} ₽ обрабатывается</p>
      </div>
    );
  }

  return (
    <div className="flex flex-col w-full h-full min-h-0 justify-between animate-fadeIn overflow-hidden">
      <div className="flex items-center gap-3 mb-3 shrink-0 pb-2 border-b border-white/10">
        <button
          type="button"
          onClick={onBack}
          className="w-9 h-9 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white cursor-pointer transition-all active:scale-95 shrink-0"
        >
          <ArrowLeft className="w-4 h-4" />
        </button>
        <div>
          <h2 className="text-lg font-extrabold text-white leading-tight">Вывод средств</h2>
          <p className="text-[11px] text-white/40">
            Доступно к выводу: <span className="text-emerald-400 font-bold">{userBalance.toLocaleString('ru-RU')} ₽</span>
          </p>
        </div>
      </div>

      <form onSubmit={handleSubmit} className="flex flex-col flex-1 min-h-0 justify-between">
        <div className="flex-1 overflow-y-auto space-y-3.5 pr-1 min-h-0">
          <div>
            <label className="text-[10px] font-semibold text-white/50 mb-1 block uppercase tracking-wider">
              Сумма вывода (₽)
            </label>
            <input
              type="number"
              placeholder="Мин. 50 ₽"
              value={amount}
              onChange={(e) => {
                setAmount(e.target.value);
                setError('');
              }}
              className="w-full bg-white/5 border border-white/10 rounded-xl px-3.5 py-2.5 text-base font-bold text-white text-center focus:outline-none focus:border-indigo-500 transition-colors [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
            />
            <div className="flex justify-between items-center mt-1.5 px-0.5 text-[11px]">
              <span className="text-white/40">Мин. 50 ₽</span>
              <button
                type="button"
                onClick={() => {
                  setAmount(userBalance.toString());
                  setError('');
                }}
                className="text-indigo-400 hover:text-indigo-300 font-semibold cursor-pointer transition-colors"
              >
                Вывести всё ({userBalance.toLocaleString('ru-RU')} ₽)
              </button>
            </div>
          </div>

          <div>
            <label className="text-[10px] font-semibold text-white/50 mb-1.5 block uppercase tracking-wider">

// Главный компонент приложения
const App = () => {
  const [user, setUser] = useState(INITIAL_USER);
  const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
  const [currentScreen, setCurrentScreen] = useState('profile');
  const [activeModal, setActiveModal] = useState(null);

  const handleTopUp = (amount, method) => {
    setUser((prev) => ({ ...prev, balance: prev.balance + amount }));
    const newTx = {
      id: `tx-${Date.now()}`,
      title: `Пополнение (${method.toUpperCase()})`,
      category: 'topup',
      icon: '💎',
      date: 'Только что',
      amount: amount,
      type: 'positive',
      status: 'completed',
    };
    setTransactions((prev) => [newTx, ...prev]);
  };

  const handleWithdraw = (amount, details) => {
    setUser((prev) => ({ ...prev, balance: prev.balance - amount }));
    const newTx = {
      id: `tx-${Date.now()}`,
      title: `Вывод средств`,
      category: 'withdraw',
      icon: '💸',
      date: 'Только что',
      amount: -amount,
      type: 'negative',
      status: 'completed',
    };
    setTransactions((prev) => [newTx, ...prev]);
  };

  const handleApplyPromo = (amount, title) => {
    setUser((prev) => ({ ...prev, balance: prev.balance + amount }));
    const newTx = {
      id: `tx-${Date.now()}`,
      title: title,
      category: 'promo',
      icon: '🎁',
      date: 'Только что',
      amount: amount,
      type: 'positive',
      status: 'completed',
    };
    setTransactions((prev) => [newTx, ...prev]);
  };

  const handleUpdateAvatar = (url) => {
    setUser((prev) => ({ ...prev, avatarUrl: url }));
  };

  return (
    <div className="w-full h-full min-h-dvh flex items-center justify-center p-2 sm:p-4 overflow-hidden">
      <div className="relative w-full max-w-[420px] h-[100dvh] max-h-[820px] sm:max-h-[780px] bg-[#0A0A18]/85 backdrop-blur-2xl border border-white/10 rounded-[28px] p-3.5 sm:p-4 text-white shadow-2xl flex flex-col justify-between overflow-hidden">
        
        {currentScreen === 'profile' && (
          <div className="flex flex-col h-full justify-between animate-fadeIn overflow-y-auto">
            <Header userName={user.username} />
            <BalanceCard user={user} onOpenAvatarModal={() => setActiveModal('avatar')} />
            <QuickActions
              onNavigate={(screen) => setCurrentScreen(screen)}
              onOpenPromoModal={() => setActiveModal('promo')}
            />
            <OperationsList
              transactions={transactions}
              onOpenAll={() => setCurrentScreen('all_operations')}
            />
            <StoreInfoCard onOpenAbout={() => setActiveModal('about')} />
            <InfoFooter onOpenModal={(modal) => setActiveModal(modal)} />
          </div>
        )}

        {currentScreen === 'topup' && (
          <TopUpScreen onBack={() => setCurrentScreen('profile')} onTopUp={handleTopUp} />
        )}

        {currentScreen === 'withdraw' && (
          <WithdrawScreen
            userBalance={user.balance}
            onBack={() => setCurrentScreen('profile')}
            onWithdraw={handleWithdraw}
          />
        )}

        {currentScreen === 'all_operations' && (
          <AllOperationsScreen
            transactions={transactions}
            onBack={() => setCurrentScreen('profile')}
          />
        )}

        <Modals
          activeModal={activeModal}
          onClose={() => setActiveModal(null)}
          user={user}
          onApplyPromo={handleApplyPromo}
          onUpdateAvatar={handleUpdateAvatar}
        />
      </div>
    </div>
  );
};

const root = createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>

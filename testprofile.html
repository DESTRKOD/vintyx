<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vintyx Store — Профиль</title>

  <!-- Tailwind CSS v4 CDN -->

  <!-- Исправленный Import Map (добавлен react/jsx-runtime для полной совместимости с Safari) -->

    "imports": {
      "react": "https://esm.sh/react@19.0.1",

      "motion/react": "https://esm.sh/motion@12.23.24/react?external=react,react-dom"
    }
  }
  </script>

  <!-- Babel Standalone для выполнения JSX прямо в браузере -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0A0A0F;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(91, 140, 255, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(125, 216, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(102, 117, 255, 0.08) 0%, transparent 40%),
        linear-gradient(145deg, #0A0A1A 0%, #1A1A3E 30%, #2D1B69 70%, #1A1A3E 100%);

      min-height: 100vh;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(10, 10, 20, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
import { motion } from 'motion/react';
import {
  Camera, ArrowUpRight, Plus, Ticket, ArrowRight, X, CheckCircle,
  Smartphone, CreditCard, Send, Zap, Gift, Copy, Check, Search,
  ArrowLeft, Inbox, AlertTriangle
} from 'lucide-react';

const Header = ({ userName }) => {
  return (
    <div className="flex items-center justify-between mb-5 px-0.5">
      <h1 className="text-sm font-extrabold text-white/40 tracking-[2px] font-sans uppercase">
        ПРОФИЛЬ
      </h1>
      <div className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/[0.04] border border-white/[0.08] text-xs font-semibold text-white/70 backdrop-blur-md">
        <span>{userName}</span>
      </div>
    </div>
  );
};

const BalanceCard = ({ user, onOpenAvatarModal }) => {
  const formattedBalance = user.balance.toLocaleString('ru-RU');

  return (
    <div className="relative w-full h-[180px] max-sm:h-[160px] bg-white/[0.03] backdrop-blur-[12px] border border-white/10 rounded-[28px] max-sm:rounded-[24px] mb-6 flex flex-col justify-center items-center shadow-xl overflow-hidden group">
      <button
        type="button"
        onClick={onOpenAvatarModal}
        className="absolute top-5 left-5 max-sm:top-4 max-sm:left-4 z-10 flex items-center justify-center w-[52px] h-[52px] max-sm:w-11 max-sm:h-11 rounded-full bg-gradient-to-br from-[#6675FF] to-[#7DD8FF] border-2 border-white/20 shadow-[0_8px_16px_rgba(91,140,255,0.3)] overflow-hidden cursor-pointer hover:scale-105 active:scale-95 transition-all group/avatar"
        title="Сменить аватарку"
      >
        {user.avatarUrl ? (
          <img src={user.avatarUrl} alt="User Avatar" className="w-full h-full object-cover rounded-full" />
        ) : (
          <span className="text-xl max-sm:text-lg font-bold text-white tracking-wider font-sans">
            {user.avatarFallback || user.name.charAt(0).toUpperCase()}
          </span>
        )}

        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover/avatar:opacity-100 flex items-center justify-center transition-opacity rounded-full">
          <Camera className="w-4 h-4 text-white/90" />
        </div>
      </button>

      <div className="relative z-10 flex flex-col items-center justify-center text-center">
        <span className="text-[12px] max-sm:text-[11px] font-semibold text-white/50 uppercase tracking-[1px] mb-1">
          Текущий баланс
        </span>
        <div className="flex items-baseline justify-center tracking-[-1px]">
          <span className="text-[48px] max-sm:text-[38px] font-extrabold text-white leading-none font-sans">
            {formattedBalance}
          </span>
          <span className="text-2xl max-sm:text-xl font-light text-white/30 ml-1.5 font-sans">
            {user.currency}
          </span>
        </div>
      </div>
    </div>
  );
};

const QuickActions = ({ onNavigate, onOpenPromoModal }) => {
  return (
    <div className="grid grid-cols-3 gap-2.5 mb-8">
      <button
        type="button"
        onClick={() => onNavigate('withdraw')}
        className="h-[60px] max-sm:h-[56px] rounded-[18px] bg-white/[0.05] hover:bg-white/[0.09] active:scale-[0.96] border border-white/10 text-white transition-all duration-200 flex flex-col items-center justify-center gap-1 backdrop-blur-md cursor-pointer group px-1"
      >
        <ArrowUpRight className="w-5 h-5 text-white/70 group-hover:text-blue-400 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 transition-all" />
        <span className="text-[11px] max-sm:text-[10px] font-semibold text-white/80 group-hover:text-white whitespace-nowrap">Вывод</span>
      </button>

      <button
        type="button"
        onClick={() => onNavigate('topup')}
        className="h-[60px] max-sm:h-[56px] rounded-[18px] bg-white/[0.05] hover:bg-white/[0.09] active:scale-[0.96] border border-white/10 text-white transition-all duration-200 flex flex-col items-center justify-center gap-1 backdrop-blur-md cursor-pointer group px-1"
      >
        <Plus className="w-5 h-5 text-white/70 group-hover:text-emerald-400 group-hover:scale-110 transition-all" />
        <span className="text-[11px] max-sm:text-[10px] font-semibold text-white/80 group-hover:text-white whitespace-nowrap">Пополнить</span>
      </button>

      <button
        type="button"
        onClick={onOpenPromoModal}
        className="h-[60px] max-sm:h-[56px] rounded-[18px] bg-white/[0.05] hover:bg-white/[0.09] active:scale-[0.96] border border-white/10 text-white transition-all duration-200 flex flex-col items-center justify-center gap-1 backdrop-blur-md cursor-pointer group px-1"
      >
        <Ticket className="w-5 h-5 text-white/70 group-hover:text-amber-400 group-hover:rotate-12 transition-all" />
        <span className="text-[11px] max-sm:text-[10px] font-semibold text-white/80 group-hover:text-white whitespace-nowrap">Промокод</span>
      </button>
    </div>
  );
};

const OperationsList = ({ transactions, onOpenAll }) => {
  const displayTransactions = transactions.slice(0, 4);

  return (
    <div className="mb-8">
      <div className="flex items-center justify-between mb-4 px-0.5">
        <h2 className="text-lg font-bold text-white tracking-tight">Операции</h2>
        <button
          type="button"
          onClick={onOpenAll}
          className="text-xs font-medium text-[#3B82F6] hover:text-blue-400 transition-colors flex items-center gap-1 cursor-pointer group"
        >
          <span>Смотреть все</span>
          <ArrowRight className="w-3.5 h-3.5 text-[#3B82F6] group-hover:translate-x-0.5 transition-transform" />
        </button>
      </div>

      {displayTransactions.length === 0 ? (
        <div className="text-center py-8 text-white/20 text-xs rounded-[18px] bg-white/[0.02] border border-white/[0.04]">
          История операций пуста
        </div>
      ) : (
        <div className="space-y-3">
          {displayTransactions.map((tx) => {
            const isPositive = tx.type === 'positive';
            return (
              <div
                key={tx.id}
                className="flex items-center justify-between p-3.5 rounded-[18px] bg-white/[0.02] hover:bg-white/[0.04] border border-white/[0.04] transition-all"
              >
                <div className="flex items-center gap-3 min-w-0 flex-1">
                  <div className="w-10 h-10 rounded-[12px] bg-white/[0.05] flex items-center justify-center text-[18px] shrink-0">
                    {tx.icon}
                  </div>
                  <div className="min-w-0 flex-1">
                    <p className="text-sm font-semibold text-white truncate">{tx.title}</p>
                    <p className="text-[11px] text-white/30 font-normal mt-0.5">{tx.date}</p>
                  </div>
                </div>

                <div className={`text-sm font-bold shrink-0 ml-3 ${isPositive ? 'text-[#10B981]' : 'text-white/60'}`}>
                  {isPositive ? '+' : '−'}
                  {Math.abs(tx.amount).toLocaleString('ru-RU')} ₽
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

const InfoFooter = ({ onOpenModal }) => {
  return (
    <div className="flex flex-wrap justify-center items-center gap-4 pt-5 pb-1 border-t border-white/[0.05] mt-auto text-center">
      <button type="button" onClick={() => onOpenModal('about')} className="text-[11px] font-medium text-white/30 hover:text-white/60 transition-colors cursor-pointer py-1">
        Магазин
      </button>
      <button type="button" onClick={() => onOpenModal('support')} className="text-[11px] font-medium text-white/30 hover:text-white/60 transition-colors cursor-pointer py-1">
        Поддержка
      </button>
      <button type="button" onClick={() => onOpenModal('terms')} className="text-[11px] font-medium text-white/30 hover:text-white/60 transition-colors cursor-pointer py-1">
        Условия
      </button>
      <button type="button" onClick={() => onOpenModal('privacy')} className="text-[11px] font-medium text-white/30 hover:text-white/60 transition-colors cursor-pointer py-1">
        Политика
      </button>
    </div>
  );
};

const TopUpScreen = ({ onBack, onTopUp }) => {
  const [amount, setAmount] = useState(500);
  const [customAmount, setCustomAmount] = useState('');
  const [method, setMethod] = useState('sbp');
  const [isSuccess, setIsSuccess] = useState(false);

  const presets = [100, 250, 500, 1000, 2500];

  const handleSelectPreset = (val) => { setAmount(val); setCustomAmount(''); };

  const handleCustomChange = (e) => {
    const val = e.target.value;
    setCustomAmount(val);
    if (val && !isNaN(Number(val))) setAmount(Number(val));
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (amount <= 0) return;
    setIsSuccess(true);
    setTimeout(() => { onTopUp(amount, method); onBack(); }, 1200);
  };

  if (isSuccess) {
    return (
      <div className="flex flex-col items-center justify-center py-16 text-center animate-fadeIn">
        <CheckCircle className="w-16 h-16 text-emerald-400 animate-bounce mb-4" />
        <h3 className="text-xl font-bold text-white mb-2">Баланс успешно пополнен!</h3>
        <p className="text-sm text-white/50">+{amount.toLocaleString('ru-RU')} ₽ зачислено на счёт</p>
      </div>
    );
  }

  return (
    <div className="flex flex-col w-full min-h-[500px] animate-fadeIn">
      <div className="flex items-center gap-3 mb-6">
        <button type="button" onClick={onBack} className="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white cursor-pointer transition-all active:scale-95">
          <ArrowLeft className="w-5 h-5" />
        </button>
        <div>
          <h2 className="text-xl font-extrabold text-white">Пополнение баланса</h2>
          <p className="text-xs text-white/40">Выберите сумму и способ оплаты</p>
        </div>
      </div>

      <div className="mb-6">
        <label className="text-xs font-semibold text-white/50 mb-2.5 block uppercase tracking-wider">Быстрый выбор суммы</label>
        <div className="grid grid-cols-5 max-sm:grid-cols-3 gap-2 mb-3">
          {presets.map((p) => (
            <button
              key={p}
              type="button"
              onClick={() => handleSelectPreset(p)}
              className={`py-2.5 rounded-xl border text-xs font-semibold transition-all cursor-pointer ${amount === p && !customAmount ? 'bg-indigo-600/30 border-indigo-500 text-white shadow-md' : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'}`}
            >
              {p} ₽
            </button>
          ))}
        </div>
        <input
          type="number"
          placeholder="Своя сумма (₽)"
          value={customAmount}
          onChange={handleCustomChange}
          className="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors"
        />
      </div>

      <div className="mb-8">
        <label className="text-xs font-semibold text-white/50 mb-2.5 block uppercase tracking-wider">Способ оплаты</label>
        <div className="space-y-2.5">
          {[
            { id: 'sbp', label: 'СБП (Система быстрых платежей)', icon: <Smartphone className="w-4 h-4 text-emerald-400" /> },
            { id: 'card', label: 'Банковская карта (Мир, Visa, MC)', icon: <CreditCard className="w-4 h-4 text-indigo-400" /> },
            { id: 'stars', label: 'Telegram Stars', icon: <Send className="w-4 h-4 text-sky-400" /> },
            { id: 'crypto', label: 'Криптовалюта (TON, USDT)', icon: <Zap className="w-4 h-4 text-amber-400" /> },
          ].map((m) => (
            <button
              key={m.id}
              type="button"
              onClick={() => setMethod(m.id)}
              className={`w-full flex items-center justify-between p-3.5 rounded-2xl border text-xs font-semibold transition-all cursor-pointer ${method === m.id ? 'bg-indigo-600/20 border-indigo-500 text-white shadow-md' : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'}`}
            >
              <div className="flex items-center gap-3">{m.icon}<span>{m.label}</span></div>
              <div className={`w-4 h-4 rounded-full border flex items-center justify-center ${method === m.id ? 'border-indigo-500 bg-indigo-500' : 'border-white/20'}`}>
                {method === m.id && <div className="w-1.5 h-1.5 bg-white rounded-full" />}
              </div>
            </button>
          ))}
        </div>
      </div>

      <button
        type="button"
        onClick={handleSubmit}
        className="w-full mt-auto py-4 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg shadow-indigo-950/50 cursor-pointer transition-all active:scale-[0.98]"
      >
        Перейти к оплате {amount.toLocaleString('ru-RU')} ₽
      </button>
    </div>
  );
};

const BANKS_LIST = [
  { name: 'Сбер', icon: '🟢' },
  { name: 'Т-Банк', icon: '🟡' },
  { name: 'ВТБ', icon: '🔵' },
  { name: 'Альфа-Банк', icon: '🔴' },
  { name: 'Газпромбанк', icon: '🔷' },
  { name: 'МТС Банк', icon: '📱' },
  { name: 'Райффайзен', icon: '💛' },
  { name: 'Свой вариант', icon: '✏️' },
];

const WithdrawScreen = ({ userBalance, onBack, onWithdraw }) => {
  const [method, setMethod] = useState('sbp');
  const [amount, setAmount] = useState('');
  const [phone, setPhone] = useState('+7');
  const [selectedBank, setSelectedBank] = useState(null);
  const [cardNumber, setCardNumber] = useState('');
  const [error, setError] = useState('');
  const [isSuccess, setIsSuccess] = useState(false);

  const numAmount = parseInt(amount) || 0;
  const fee = Math.round(numAmount * 0.03 * 100) / 100;
  const finalAmount = Math.max(0, Math.round((numAmount - fee) * 100) / 100);

  const formatPhoneInput = (val) => {
    let digits = val.replace(/\D/g, '');
    if (digits.length === 0) return '+7';
    if (digits.startsWith('7') || digits.startsWith('8')) digits = digits.substring(1);
    let res = '+7';
    if (digits.length > 0) res += ' (' + digits.substring(0, 3);
    if (digits.length >= 3) res += ') ' + digits.substring(3, 6);
    if (digits.length >= 6) res += '-' + digits.substring(6, 8);
    if (digits.length >= 8) res += '-' + digits.substring(8, 10);
    return res;
  };

  const formatCardInput = (val) => {
    const digits = val.replace(/\D/g, '').substring(0, 16);
    let formatted = '';
    for (let i = 0; i < digits.length; i++) {
      if (i > 0 && i % 4 === 0) formatted += ' ';
      formatted += digits[i];
    }
    return formatted;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!numAmount || numAmount < 50) { setError('Минимальная сумма вывода 50 ₽'); return; }
    if (numAmount > userBalance) { setError(`Недостаточно средств. Ваш баланс: ${userBalance.toLocaleString('ru-RU')} ₽`); return; }

    let details = '';
    if (method === 'sbp') {
      const cleanPhone = phone.replace(/\D/g, '');
      if (cleanPhone.length < 10) { setError('Укажите корректный номер телефона для СБП'); return; }
      if (!selectedBank) { setError('Выберите банк получателя'); return; }
      details = `СБП: ${phone}, Банк: ${selectedBank}`;
    } else {
      const cleanCard = cardNumber.replace(/\s/g, '');
      if (cleanCard.length < 16) { setError('Укажите корректный 16-значный номер карты'); return; }
      details = `Карта: ${cardNumber}`;
    }

    setError('');
    setIsSuccess(true);
    setTimeout(() => { onWithdraw(numAmount, details); onBack(); }, 1400);
  };

  if (isSuccess) {
    return (
      <div className="flex flex-col items-center justify-center py-16 text-center animate-fadeIn">
        <CheckCircle className="w-16 h-16 text-indigo-400 animate-bounce mb-4" />
        <h3 className="text-xl font-bold text-white mb-2">Заявка на вывод отправлена!</h3>
        <p className="text-sm text-white/50">Запрос на {numAmount.toLocaleString('ru-RU')} ₽ обрабатывается</p>
      </div>
    );
  }

  return (
    <div className="flex flex-col w-full min-h-[500px] animate-fadeIn">
      <div className="flex items-center gap-3 mb-6">
        <button type="button" onClick={onBack} className="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white cursor-pointer transition-all active:scale-95">
          <ArrowLeft className="w-5 h-5" />
        </button>
        <div>
          <h2 className="text-xl font-extrabold text-white">Вывод средств</h2>
          <p className="text-xs text-white/40">
            Доступно к выводу: <span className="text-white font-semibold">{userBalance.toLocaleString('ru-RU')} ₽</span>
          </p>
        </div>
      </div>

      <form onSubmit={handleSubmit} className="flex flex-col flex-1">
        <div className="mb-6">
          <label className="text-xs font-semibold text-white/50 mb-2 block uppercase tracking-wider">Сумма вывода (₽)</label>
          <input
            type="number"
            placeholder="Мин. 50 ₽"
            value={amount}
            onChange={(e) => setAmount(e.target.value)}
            className="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3.5 text-lg font-bold text-white text-center focus:outline-none focus:border-indigo-500 transition-colors"
          />
        </div>

        <div className="mb-6">
          <label className="text-xs font-semibold text-white/50 mb-2.5 block uppercase tracking-wider">Способ получения</label>
          <div className="grid grid-cols-2 gap-2 mb-4">
            <button
              type="button"
              onClick={() => { setMethod('sbp'); setError(''); }}
              className={`flex items-center justify-center gap-2 p-3 rounded-2xl border text-xs font-semibold transition-all cursor-pointer ${method === 'sbp' ? 'bg-indigo-600/30 border-indigo-500 text-white shadow-md' : 'bg-white/5 border-white/10 text-white/60 hover:bg-white/10'}`}
            >
              <Smartphone className="w-4 h-4 text-emerald-400" />
              <span>СБП (Телефон)</span>
            </button>

            <button
              type="button"
              onClick={() => { setMethod('card'); setError(''); }}
              className={`flex items-center justify-center gap-2 p-3 rounded-2xl border text-xs font-semibold transition-all cursor-pointer ${method === 'card' ? 'bg-indigo-600/30 border-indigo-500 text-white shadow-md' : 'bg-white/5 border-white/10 text-white/60 hover:bg-white/10'}`}
            >
              <CreditCard className="w-4 h-4 text-indigo-400" />
              <span>Банковская карта</span>
            </button>
          </div>

          {method === 'sbp' && (
            <div className="space-y-4">
              <div>
                <label className="text-[11px] font-medium text-white/50 mb-1.5 block">Номер телефона СБП</label>
                <input
                  type="tel"
                  value={phone}
                  onChange={(e) => setPhone(formatPhoneInput(e.target.value))}
                  placeholder="+7 (999) 000-00-00"
                  className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="text-[11px] font-medium text-white/50 mb-1.5 block">Выберите банк</label>
                <div className="grid grid-cols-2 gap-2">
                  {BANKS_LIST.map((b) => (
                    <button
                      key={b.name}
                      type="button"
                      onClick={() => setSelectedBank(b.name)}
                      className={`flex items-center justify-between p-2.5 rounded-xl border text-xs text-left transition-all cursor-pointer ${selectedBank === b.name ? 'bg-indigo-600/20 border-indigo-500 text-white font-medium' : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'}`}
                    >
                      <span className="flex items-center gap-2"><span>{b.icon}</span><span>{b.name}</span></span>
                      {selectedBank === b.name && <Check className="w-3.5 h-3.5 text-indigo-400" />}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {method === 'card' && (
            <div>
              <label className="text-[11px] font-medium text-white/50 mb-1.5 block">Номер банковской карты</label>
              <input
                type="text"
                value={cardNumber}

const BottomNav = ({ activeScreen, onNavigate, cartCount = 0, onOpenInfoModal }) => {
  const items = [
    { id: 'profile', label: 'Профиль' },
    { id: 'home', label: 'Главная' },
    { id: 'cart', label: 'Корзина', badge: cartCount },
    { id: 'info', label: 'Инфо' },
  ];

  const getIndex = (screen) => {
    if (screen === 'profile' || screen === 'all-operations' || screen === 'topup' || screen === 'withdraw') return 0;
    if (screen === 'home') return 1;
    if (screen === 'cart') return 2;
    if (screen === 'info') return 3;
    return 0;
  };

  const activeIndex = getIndex(activeScreen);

  const handleClick = (item) => {
    if (item.id === 'info') {
      if (onOpenInfoModal) onOpenInfoModal();
      else onNavigate('profile');
    } else {
      onNavigate(item.id);
    }
  };

  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-full max-w-[360px] px-4 pointer-events-auto select-none">
      <nav className="relative w-full rounded-[36px] bg-[#121228]/60 backdrop-blur-2xl border border-white/10 p-1.5 flex items-center justify-between shadow-[0_12px_40px_rgba(0,0,0,0.6)]">
        {items.map((item, index) => {
          const isActive = activeIndex === index;

          return (
            <button
              key={item.id}
              type="button"
              onClick={() => handleClick(item)}
              className="relative flex-1 py-2 flex flex-col items-center justify-center gap-1 rounded-[26px] border-none bg-transparent cursor-pointer transition-transform duration-150 active:scale-90 group"
            >
              {isActive && (
                <motion.div
                  layoutId="liquidActiveGlass"
                  className="absolute inset-0 rounded-[26px] bg-gradient-to-b from-indigo-500/25 via-blue-600/20 to-purple-500/15 border border-indigo-400/30 backdrop-blur-md"
                  transition={{ type: 'spring', stiffness: 420, damping: 30, mass: 0.8 }}
                />
              )}

              <span className={`relative z-10 text-[10px] font-semibold tracking-tight transition-colors duration-200 ${isActive ? 'text-white font-bold' : 'text-white/40 group-hover:text-white/70'}`}>
                {item.label}
              </span>
            </button>
          );
        })}
      </nav>
    </div>
  );
};

function App() {
  const [activeScreen, setActiveScreen] = useState('profile');
  const [activeModal, setActiveModal] = useState(null);

  const [user, setUser] = useState(() => {
    try {
      const saved = localStorage.getItem('vintyx_user');
      return saved ? JSON.parse(saved) : {
        name: 'Vintyx User',
        username: '@vintyx_member',
        userId: '849201',
        avatarUrl: null,
        avatarFallback: 'V',
        balance: 1488,
        currency: '₽',
        isPremium: true,
        joinedDate: '12 марта 2026',
      };
    } catch (e) {
      return { name: 'Vintyx User', avatarFallback: 'V', balance: 1488, currency: '₽' };
    }
  });

  const [usedPromos, setUsedPromos] = useState([]);

  const [transactions, setTransactions] = useState([
    { id: 'tx-1', title: 'Brawl Pass', category: 'pass', icon: '🎮', date: 'Сегодня, 14:32', amount: -149, type: 'negative', status: 'completed' },
    { id: 'tx-2', title: 'Гемы', category: 'gems', icon: '⚡', date: 'Вчера, 09:15', amount: -299, type: 'negative', status: 'completed' },
    { id: 'tx-3', title: 'Пополнение', category: 'topup', icon: '💎', date: '12 мар, 18:00', amount: 500, type: 'positive', status: 'completed' },
  ]);

  const handleTopUp = (amount, method) => {
    setUser((prev) => ({ ...prev, balance: prev.balance + amount }));
    const newTx = {
      id: `tx-${Date.now()}`,
      title: `Пополнение (${method.toUpperCase()})`,
      category: 'topup', icon: '💎', date: 'Только что', amount: amount, type: 'positive', status: 'completed',
    };
    setTransactions((prev) => [newTx, ...prev]);
  };

  const handleWithdraw = (amount, details) => {
    setUser((prev) => ({ ...prev, balance: Math.max(0, prev.balance - amount) }));
    const newTx = {
      id: `tx-${Date.now()}`,
      title: `Вывод (${details.slice(0, 15)}...)`,
      category: 'withdraw', icon: '💸', date: 'Только что', amount: -amount, type: 'negative', status: 'completed',
    };
    setTransactions((prev) => [newTx, ...prev]);
  };

  const handleApplyPromo = (code) => {
    const cleanCode = code.toUpperCase();
    if (usedPromos.includes(cleanCode)) return false;

    let bonus = 0;
    if (cleanCode === 'VINTYX2026') bonus = 200;
    else if (cleanCode === 'START') bonus = 100;
    else if (cleanCode === 'BONUS500') bonus = 500;

    if (bonus > 0) {
      setUser((prev) => ({ ...prev, balance: prev.balance + bonus }));
      setUsedPromos((prev) => [...prev, cleanCode]);
      const newTx = {
        id: `tx-${Date.now()}`,
        title: `Промокод ${cleanCode}`,
        category: 'promo', icon: '🎁', date: 'Только что', amount: bonus, type: 'positive', status: 'completed',
      };
      setTransactions((prev) => [newTx, ...prev]);
      return true;
    }
    return false;
  };

  return (
    <div className="min-h-screen w-full flex flex-col items-center justify-center p-4 max-sm:p-2 select-none relative pb-28">
      <main className="w-full max-w-[440px] min-h-[620px] mx-auto p-7 max-sm:p-5 rounded-[40px] max-sm:rounded-[32px] bg-[#0A0A14]/90 border border-white/[0.08] shadow-[0_50px_100px_-20px_rgba(0,0,0,0.8)] backdrop-blur-2xl relative flex flex-col font-sans">
        {activeScreen === 'profile' && (
          <div className="flex flex-col animate-fadeIn">
            <Header userName={user.name} />
            <BalanceCard user={user} onOpenAvatarModal={() => setActiveModal('avatar')} />
            <QuickActions onNavigate={setActiveScreen} onOpenPromoModal={() => setActiveModal('promo')} />
            <OperationsList transactions={transactions} onOpenAll={() => setActiveScreen('all-operations')} />
            <InfoFooter onOpenModal={(type) => setActiveModal(type)} />
          </div>
        )}

        {activeScreen === 'all-operations' && (
          <AllOperationsScreen transactions={transactions} onBack={() => setActiveScreen('profile')} />
        )}

        {activeScreen === 'topup' && (
          <TopUpScreen onBack={() => setActiveScreen('profile')} onTopUp={handleTopUp} />
        )}

        {activeScreen === 'withdraw' && (
          <WithdrawScreen userBalance={user.balance} onBack={() => setActiveScreen('profile')} onWithdraw={handleWithdraw} />
        )}
      </main>

      <BottomNav
        activeScreen={activeScreen}
        onNavigate={setActiveScreen}
        cartCount={0}
        onOpenInfoModal={() => setActiveModal('info')}
      />

      <Modals
        activeModal={activeModal}
        onClose={() => setActiveModal(null)}
        user={user}
        onApplyPromo={handleApplyPromo}
        onUpdateAvatar={(url) => setUser((prev) => ({ ...prev, avatarUrl: url }))}
      />
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App />);
  </script>

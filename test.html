<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Emoji Test</title>
    <style>
        /* Подключаем шрифт Apple Color Emoji из интернета */
        @font-face {
            font-family: 'Apple Emoji';
            src: url('https://cdn.jsdelivr.net/gh/mgao/OpenMoji-Apple-Color/fonts/AppleColorEmoji.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0A0A1A 0%, #1A1A3E 30%, #2D1B69 70%, #1A1A3E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Apple Emoji', -apple-system, 'Segoe UI', system-ui, sans-serif;
            color: #FFFFFF;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 32px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #7DD8FF 0%, #6675FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 30px;
            font-family: -apple-system, 'Segoe UI', sans-serif;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .emoji-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .emoji-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
            border-color: rgba(91, 140, 255, 0.2);
        }

        .emoji-item .emoji {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 6px;
            font-family: 'Apple Emoji', sans-serif;
        }

        .emoji-item .label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            font-family: -apple-system, 'Segoe UI', sans-serif;
        }

        .emoji-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .emoji-row .big-emoji {
            font-size: 3rem;
            font-family: 'Apple Emoji', sans-serif;
        }

        .emoji-text {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Apple Emoji', -apple-system, 'Segoe UI', sans-serif;
            line-height: 1.8;
        }

        .emoji-text span {
            font-family: 'Apple Emoji', sans-serif;
        }

        .note {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            font-family: -apple-system, 'Segoe UI', sans-serif;
        }

        .note code {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 500px) {
            .emoji-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .emoji-item .emoji {
                font-size: 2.8rem;
            }
            .container {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🍎 Apple Emoji</div>
    <div class="subtitle">Тест шрифта Apple Color Emoji</div>

    <!-- Основные эмодзи -->
    <div class="emoji-grid">
        <div class="emoji-item">
            <span class="emoji">💎</span>
            <span class="label">💎 Бриллиант</span>
        </div>
        <div class="emoji-item">
            <span class="emoji">🎮</span>
            <span class="label">🎮 Геймпад</span>
        </div>
        <div class="emoji-item">
            <span class="emoji">⭐</span>
            <span class="label">⭐ Звезда</span>
        </div>
        <div class="emoji-item">
            <span class="emoji">✨</span>
            <span class="label">✨ Искры</span>
        </div>
    </div>

    <!-- Дополнительные эмодзи -->
    <div class="emoji-grid">
        <div class="emoji-item">
            <span class="emoji">🛒</span>
            <span class="label">🛒 Корзина</span>
        </div>
        <div class="emoji-item">
            <span class="emoji">💰</span>
            <span class="label">💰 Деньги</span>
        </div>
        <div class="emoji-item">
            <span class="emoji">👤</span>
            <span class="label">👤 Профиль</span>
        </div>
        <div class="emoji-item">
            <span class="emoji">🎉</span>
            <span class="label">🎉 Праздник</span>
        </div>
    </div>

    <!-- Большой набор эмодзи -->
    <div class="emoji-row">
        <span class="big-emoji">💎</span>
        <span class="big-emoji">🎮</span>
        <span class="big-emoji">⭐</span>
        <span class="big-emoji">✨</span>
        <span class="big-emoji">🛒</span>
        <span class="big-emoji">💰</span>
        <span class="big-emoji">👤</span>
        <span class="big-emoji">🎉</span>
        <span class="big-emoji">📦</span>
        <span class="big-emoji">💳</span>
    </div>

    <!-- Текст с эмодзи -->
    <div class="emoji-text">
        <span>💎</span> Vintyx Store <span>⭐</span><br>
        <span>🎮</span> Игровой донат <span>✨</span>
    </div>

    <div class="note">
        Шрифт: <code>Apple Color Emoji</code><br>
        Подключён через <code>@font-face</code> из интернета.
    </div>
</div>

</body>
</html>

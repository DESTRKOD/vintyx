<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vintyx Store — Профиль</title>
    <style>
        /* ======================================================
                   ФОН ИЗ ОРИГИНАЛЬНОГО VINTYX SHOP
                   ====================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #FFFFFF;
            background: radial-gradient(ellipse at 20% 50%, rgba(91, 140, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(125, 216, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(102, 117, 255, 0.08) 0%, transparent 40%),
                linear-gradient(145deg, #0A0A1A 0%, #1A1A3E 30%, #2D1B69 70%, #1A1A3E 100%);
            background-attachment: fixed;
        }

        /* ======================================================
                   КОНТЕЙНЕР ПРОФИЛЯ
                   ====================================================== */
        .profile-screen {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 8px 0 20px;
        }

        /* ======================================================
                   БАЛАНСОВАЯ КАРТА — ПЛАВНЫЕ ПЕРЕЛИВАЮЩИЕСЯ КЛЯКСЫ
                   ====================================================== */
        .balance-card {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(60, 80, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 28px;
            height: 190px;
            background: #0A0A14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 28px 24px 32px;
        }

        /* Основной фон с плавными кляксами */
        .balance-card .blob-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 32px;
            background:
                radial-gradient(ellipse at 15% 20%, rgba(40, 120, 255, 0.3) 0%, transparent 45%),
                radial-gradient(ellipse at 75% 80%, rgba(80, 180, 255, 0.25) 0%, transparent 40%),
                radial-gradient(ellipse at 45% 40%, rgba(20, 80, 220, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 25%, rgba(60, 160, 255, 0.15) 0%, transparent 35%),
                radial-gradient(ellipse at 10% 75%, rgba(100, 200, 255, 0.1) 0%, transparent 40%);
            animation: blobFloat1 6s ease-in-out infinite alternate;
        }

        /* Второй слой клякс для глубины */
        .balance-card .blob-bg2 {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 32px;
            background:
                radial-gradient(ellipse at 30% 60%, rgba(60, 140, 255, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 30%, rgba(40, 100, 240, 0.2) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 85%, rgba(80, 180, 255, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 5% 45%, rgba(120, 200, 255, 0.1) 0%, transparent 35%),
                radial-gradient(ellipse at 90% 60%, rgba(30, 90, 230, 0.2) 0%, transparent 40%);
            animation: blobFloat2 7s ease-in-out infinite alternate;
        }

        /* Третий слой для сложности */
        .balance-card .blob-bg3 {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 32px;
            background:
                radial-gradient(ellipse at 70% 15%, rgba(100, 200, 255, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 25% 90%, rgba(50, 130, 255, 0.2) 0%, transparent 45%),
                radial-gradient(ellipse at 55% 55%, rgba(20, 70, 210, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 10%, rgba(80, 170, 255, 0.08) 0%, transparent 35%);
            animation: blobFloat3 5.5s ease-in-out infinite alternate;
        }

        @keyframes blobFloat1 {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.8;
            }
            33% {
                transform: scale(1.02) translate(3%, -2%);
                opacity: 1;
            }
            66% {
                transform: scale(0.98) translate(-2%, 3%);
                opacity: 0.9;
            }
            100% {
                transform: scale(1.01) translate(2%, -1%);
                opacity: 0.85;
            }
        }

        @keyframes blobFloat2 {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.04) translate(-3%, 2%);
                opacity: 0.9;
            }
            100% {
                transform: scale(0.96) translate(4%, -3%);
                opacity: 0.7;
            }
        }

        @keyframes blobFloat3 {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.5;
            }
            40% {
                transform: scale(0.97) translate(-4%, -2%);
                opacity: 0.8;
            }
            80% {
                transform: scale(1.03) translate(3%, 4%);
                opacity: 0.6;
            }
            100% {
                transform: scale(0.99) translate(-1%, -3%);
                opacity: 0.7;
            }
        }

        /* Четвёртый слой — яркие акценты */
        .balance-card .blob-bg4 {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 32px;
            background:
                radial-gradient(circle at 20% 30%, rgba(80, 180, 255, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(40, 120, 255, 0.12) 0%, transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(60, 160, 255, 0.08) 0%, transparent 45%);
            animation: blobFloat4 4.5s ease-in-out infinite alternate;
        }

        @keyframes blobFloat4 {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.4;
            }
            100% {
                transform: scale(1.08) translate(-5%, 5%);
                opacity: 0.8;
            }
        }

        /* Тёмные участки для контраста (чёрные кляксы) */
        .balance-card .dark-blobs {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 32px;
            background:
                radial-gradient(ellipse at 40% 20%, rgba(0, 0, 0, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 0, 0, 0.3) 0%, transparent 45%),
                radial-gradient(ellipse at 15% 80%, rgba(0, 0, 0, 0.25) 0%, transparent 40%),
                radial-gradient(ellipse at 85% 30%, rgba(0, 0, 0, 0.2) 0%, transparent 35%);
            animation: darkBlobFloat 8s ease-in-out infinite alternate;
        }

        @keyframes darkBlobFloat {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.03) translate(-3%, 2%);
                opacity: 0.7;
            }
            100% {
                transform: scale(0.97) translate(4%, -3%);
                opacity: 0.4;
            }
        }

        /* Контент поверх анимации */
        .balance-card>* {
            position: relative;
            z-index: 1;
        }

        /* Аватарка в левом верхнем углу */
        .balance-card .avatar-wrap {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            flex-shrink: 0;
            z-index: 2;
        }

        .balance-card .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .balance-card .avatar-wrap .fallback {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }

        /* Баланс — строго по центру */
        .balance-card .balance-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
            position: relative;
        }

        .balance-card .balance-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .balance-card .balance-amount {
            font-size: 3rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            line-height: 1;
            text-shadow: 0 0 40px rgba(80, 160, 255, 0.08);
        }

        .balance-card .balance-currency {
            font-size: 1.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
            margin-left: 4px;
        }

        /* Тонкая линия внизу карты */
        .balance-card .card-footer-line {
            position: absolute;
            bottom: 16px;
            left: 24px;
            right: 24px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            z-index: 1;
        }

        /* ======================================================
                   КНОПКИ БЫСТРЫХ ДЕЙСТВИЙ — РАВНЫЕ
                   ====================================================== */
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
        }

        .quick-actions .qa-btn {
            flex: 1;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0 6px;
            white-space: nowrap;
        }

        .quick-actions .qa-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.08);
        }

        .quick-actions .qa-btn svg {
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
        }

        /* ======================================================
                   ОПЕРАЦИИ
                   ====================================================== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-header .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: -0.2px;
        }

        .section-header .section-link {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section-header .section-link:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        .section-header .section-link svg {
            width: 14px;
            height: 14px;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 2;
            fill: none;
        }

        /* Список операций */
        .operations-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 32px;
        }

        .operation-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.15s ease;
            cursor: default;
        }

        .operation-item:active {
            background: rgba(255, 255, 255, 0.04);
        }

        .operation-item .op-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .operation-item .op-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.2);
        }

        .operation-item .op-info {
            flex: 1;
            min-width: 0;
        }

        .operation-item .op-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .operation-item .op-date {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            margin-top: 1px;
        }

        .operation-item .op-amount {
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFFFFF;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .operation-item .op-amount.negative {
            color: rgba(255, 255, 255, 0.5);
        }

        .operation-item .op-amount.positive {
            color: #4ADE80;
        }

        /* Пустое состояние */
        .operations-empty {
            text-align: center;
            padding: 28px 0 12px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.8rem;
        }

        /* ======================================================
                   ИНФОРМАЦИОННЫЙ БЛОК — ЦЕНТРИРОВАННЫЙ
                   ====================================================== */
        .info-block {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px 20px;
            padding: 16px 4px 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 8px;
            text-align: center;
        }

        .info-block .info-item {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
            letter-spacing: 0.2px;
            padding: 4px 0;
        }

        .info-block .info-item:hover {
            color: rgba(255, 255, 255, 0.4);
        }

        .info-block .info-item:active {
            opacity: 0.5;
        }

        /* ======================================================
                   АДАПТИВНОСТЬ
                   ====================================================== */
        @media (max-width: 420px) {
            .balance-card {
                border-radius: 28px;
                height: 170px;
                padding: 24px 20px 28px;
            }

            .balance-card .avatar-wrap {
                top: 16px;
                left: 16px;
                width: 36px;
                height: 36px;
            }

            .balance-card .balance-amount {
                font-size: 2.4rem;
            }

            .quick-actions .qa-btn {
                height: 46px;
                font-size: 0.75rem;
                border-radius: 14px;
            }

            .quick-actions .qa-btn svg {
                width: 16px;
                height: 16px;
            }

            .operation-item {
                padding: 10px 12px;
            }

            .operation-item .op-icon {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
            }

            .operation-item .op-name {
                font-size: 0.8rem;
            }

            .info-block {
                gap: 4px 14px;
                padding: 14px 2px 4px;
            }

            .info-block .info-item {
                font-size: 0.65rem;
            }
        }

        @media (max-width: 360px) {
            .balance-card {
                height: 150px;
                padding: 20px 16px 24px;
            }

            .balance-card .avatar-wrap {
                top: 14px;
                left: 14px;
                width: 32px;
                height: 32px;
            }

            .balance-card .avatar-wrap .fallback {
                font-size: 0.8rem;
            }

            .balance-card .balance-amount {
                font-size: 2rem;
            }

            .quick-actions {
                gap: 6px;
            }

            .quick-actions .qa-btn {
                font-size: 0.65rem;
                height: 40px;
                padding: 0 4px;
            }

            .quick-actions .qa-btn svg {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-screen">

        <!-- ============================================
        БАЛАНСОВАЯ КАРТА — ПЛАВНЫЕ ПЕРЕЛИВАЮЩИЕСЯ КЛЯКСЫ
        ============================================ -->
        <div class="balance-card">

            <!-- Слои с плавными кляксами -->
            <div class="blob-bg"></div>
            <div class="blob-bg2"></div>
            <div class="blob-bg3"></div>
            <div class="blob-bg4"></div>
            <div class="dark-blobs"></div>

            <!-- Аватарка в левом верхнем углу -->
            <div class="avatar-wrap">
                <span class="fallback">V</span>
            </div>

            <!-- Баланс — строго по центру -->
            <div class="balance-center">
                <span class="balance-label">Баланс</span>
                <div>
                    <span class="balance-amount">1 488</span>
                    <span class="balance-currency">₽</span>
                </div>
            </div>

            <!-- Декоративная линия -->
            <div class="card-footer-line"></div>
        </div>

        <!-- ============================================
        БЫСТРЫЕ ДЕЙСТВИЯ — 3 РАВНЫЕ КНОПКИ
        ============================================ -->
        <div class="quick-actions">
            <button class="qa-btn" onclick="alert('Вывод')">
                <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                Вывод
            </button>
            <button class="qa-btn" onclick="alert('Пополнить')">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                Пополнить
            </button>
            <button class="qa-btn" onclick="alert('Промокод')">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Промокод
            </button>
        </div>

        <!-- ============================================
        ОПЕРАЦИИ
        ============================================ -->
        <div class="section-header">
            <span class="section-title">Мои операции</span>
            <span class="section-link" onclick="alert('Все операции')">
                Все операции
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </span>
        </div>

        <div class="operations-list">
            <!-- Операция 1 -->
            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">🎮</div>
                    <div class="op-info">
                        <div class="op-name">Brawl Pass</div>
                        <div class="op-date">Сегодня, 14:32</div>
                    </div>
                </div>
                <span class="op-amount negative">−149 ₽</span>
            </div>

            <!-- Операция 2 -->
            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">⚡</div>
                    <div class="op-info">
                        <div class="op-name">Гемы</div>
                        <div class="op-date">Вчера, 09:15</div>
                    </div>
                </div>
                <span class="op-amount negative">−299 ₽</span>
            </div>

            <!-- Операция 3 -->
            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">💎</div>
                    <div class="op-info">
                        <div class="op-name">Пополнение</div>
                        <div class="op-date">12 мар, 18:00</div>
                    </div>
                </div>
                <span class="op-amount positive">+500 ₽</span>
            </div>
        </div>

        <!-- ============================================
        ИНФОРМАЦИОННЫЙ БЛОК — ЦЕНТРИРОВАННЫЙ
        ============================================ -->
        <div class="info-block">
            <span class="info-item" onclick="alert('О магазине')">О магазине</span>
            <span class="info-item" onclick="alert('Поддержка')">Поддержка</span>
            <span class="info-item" onclick="alert('Условия')">Условия</span>
            <span class="info-item" onclick="alert('Политика конфиденциальности')">Политика</span>
        </div>

    </div>

</body>
</html>

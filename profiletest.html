<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Профиль пользователя</title>
    <style>
        /* ======================================================
           СБРОС И БАЗОВЫЕ СТИЛИ
           ====================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #06060D;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            padding: 16px;
            color: #FFFFFF;
        }

        /* ======================================================
           ОСНОВНОЙ КОНТЕЙНЕР ПРОФИЛЯ
           ====================================================== */
        .profile-card {
            width: 100%;
            max-width: 440px;
            background: rgba(13, 13, 26, 0.85);
            backdrop-filter: blur(28px) saturate(1.8);
            -webkit-backdrop-filter: blur(28px) saturate(1.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 36px;
            padding: 24px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ХЕДЕР ПОЛЬЗОВАТЕЛЯ */
        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-container {
            position: relative;
            width: 52px;
            height: 52px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #1A1A2E;
        }

        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            background: #10B981;
            border: 3px solid #0D0D1A;
            border-radius: 50%;
        }

        .user-details h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFF;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-details p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .level-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #A5B4FC;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* КАРТОЧКА БАЛАНСА */
        .balance-card {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.6) 0%, rgba(15, 15, 35, 0.8) 100%);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 26px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
            pointer-events: none;
        }

        .balance-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .balance-amount {
            font-size: 2.1rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }

        .hide-toggle {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .hide-toggle:hover {
            color: #FFF;
        }

        /* КНОПКИ ДЕЙСТВИЙ: ВЫВОД / ПОПОЛНИТЬ / ПРОМОКОД */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .action-btn {
            height: 60px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.72rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            stroke-width: 2.2;
            transition: transform 0.2s;
        }

        .btn-withdraw svg { stroke: #60A5FA; }
        .btn-topup svg { stroke: #34D399; }
        .btn-promo svg { stroke: #FBBF24; }

        .action-btn:hover svg {
            transform: scale(1.15);
        }

        /* ПРОХОДКА / ТОВАР С СВГ ИКОНКОЙ */
        .pass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .pass-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Иконка SVG на проходке */
        .pass-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(217, 119, 6, 0.1) 100%);
            border: 1px solid rgba(245, 158, 11, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pass-icon-box svg {
            width: 24px;
            height: 24px;
            stroke: #FBBF24;
            fill: rgba(251, 191, 36, 0.15);
        }

        .pass-text h4 {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .pass-text p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .buy-pass-btn {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #FBBF24;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 8px 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .buy-pass-btn:hover {
            background: rgba(245, 158, 11, 0.3);
        }

        /* ИСТОРИЯ ОПЕРАЦИЙ */
        .operations-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .operations-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .op-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .op-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .op-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .op-icon.in { background: rgba(52, 211, 153, 0.15); color: #34D399; }
        .op-icon.out { background: rgba(96, 165, 250, 0.15); color: #60A5FA; }

        .op-info h5 { font-size: 0.82rem; font-weight: 600; }
        .op-info span { font-size: 0.7rem; color: rgba(255, 255, 255, 0.4); }

        .op-amount {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .op-amount.plus { color: #34D399; }
        .op-amount.minus { color: #F87171; }

        /* ======================================================
           МОДАЛЬНЫЕ ОКНА (ПОПОЛНЕНИЕ, ВЫВОД, ПРОМОКОД)
           ====================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 380px;
            background: #121224;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #FFF;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Формы внутри модалок */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 0 16px;
            color: #FFF;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #6366F1;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            color: #FFF;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366F1;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #FFF;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-green { background: linear-gradient(135deg, #10B981, #059669); }
        .btn-blue { background: linear-gradient(135deg, #3B82F6, #2563EB); }
        .btn-amber { background: linear-gradient(135deg, #F59E0B, #D97706); }

        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .submit-btn:active { transform: scale(0.98); }

        /* Уведомления (Toasts) */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(16, 185, 129, 0.95);
            color: #FFF;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 200;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Уведомление -->
    <div id="toast" class="toast">Успешно!</div>

    <!-- ГЛАВНАЯ КАРТОЧКА ПРОФИЛЯ -->
    <div class="profile-card">
        
        <!-- Хедер пользователя -->
        <div class="user-header">
            <div class="user-info">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="avatar" />
                    <span class="status-dot"></span>
                </div>
                <div class="user-details">
                    <h2>Alexey <span class="level-badge">LVL 12</span></h2>
                    <p>ID: #849201</p>
                </div>
            </div>
        </div>

        <!-- Карточка баланса -->
        <div class="balance-card">
            <div class="balance-label">
                <span>Основной баланс</span>
                <button class="hide-toggle" id="toggleBalanceBtn" onclick="toggleBalance()">
                    👁️
                </button>
            </div>
            <div class="balance-amount" id="balanceDisplay">12 450 ₽</div>
        </div>

        <!-- КНОПКИ ДЕЙСТВИЙ: ВЫВОД / ПОПОЛНИТЬ / ПРОМОКОД -->
        <div class="actions-grid">
            
            <!-- Вывод -->
            <button class="action-btn btn-withdraw" onclick="openModal('withdrawModal')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M7 17L17 7M17 7H7M17 7V17" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Вывод</span>
            </button>

            <!-- Пополнить -->
            <button class="action-btn btn-topup" onclick="openModal('topupModal')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 5V19M5 12H19" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Пополнить</span>
            </button>

            <!-- Промокод -->
            <button class="action-btn btn-promo" onclick="openModal('promoModal')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M15 5V7M15 11V13M15 17V19M5 5H19C20.1 5 21 5.9 21 7V9C19.9 9 19 9.9 19 11C19 12.1 19.9 13 21 13V17C21 18.1 20.1 19 19 19H5C3.9 19 3 18.1 3 17V13C4.1 13 5 12.1 5 11C5 9.9 4.1 9 3 9V7C3 5.9 3.9 5 5 5Z" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Промокод</span>
            </button>

        </div>

        <!-- ПРОХОДКА (С SVG ИКОНКОЙ) -->
        <div class="pass-card">
            <div class="pass-info">
                <!-- SVG Иконка на проходке -->
                <div class="pass-icon-box">
                    <svg viewBox="0 0 24 24">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="pass-text">
                    <h4>Brawl Pass Plus</h4>
                    <p>Сезон 28 • Активен</p>
                </div>
            </div>
            <button class="buy-pass-btn" onclick="buyPass()">799 ₽</button>
        </div>

        <!-- ИСТОРИЯ ОПЕРАЦИЙ -->
        <div class="operations-section">
            <div class="section-header">
                <h3>История операций</h3>
            </div>
            <div class="operations-list" id="operationsList">
                <!-- Заполняется через JS -->
            </div>
        </div>

    </div>

    <!-- ======================================================
       МОДАЛЬНОЕ ОКНО: ПОПОЛНЕНИЕ
       ====================================================== -->
    <div id="topupModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Пополнение баланса</h3>
                <button class="close-btn" onclick="closeModal('topupModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Выберите или введите сумму (₽)</label>
                <div class="presets-grid">
                    <button class="preset-btn" onclick="setTopupAmount(300)">300 ₽</button>
                    <button class="preset-btn" onclick="setTopupAmount(500)">500 ₽</button>
                    <button class="preset-btn" onclick="setTopupAmount(1000)">1 000 ₽</button>
                </div>
                <input type="number" id="topupInput" class="input-field" placeholder="Сумма пополнения..." value="500" />
            </div>
            <button class="submit-btn btn-green" onclick="handleTopup()">Пополнить счет</button>
        </div>
    </div>

    <!-- ======================================================
       МОДАЛЬНОЕ ОКНО: ВЫВОД
       ====================================================== -->
    <div id="withdrawModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Вывод средств</h3>
                <button class="close-btn" onclick="closeModal('withdrawModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Номер карты или телефона (СБП)</label>
                <input type="text" id="withdrawTarget" class="input-field" placeholder="+7 (900) 000-00-00" />
            </div>
            <div class="form-group">
                <label>Сумма вывода (₽)</label>
                <input type="number" id="withdrawAmount" class="input-field" placeholder="Сумма..." value="1000" />
            </div>
            <button class="submit-btn btn-blue" onclick="handleWithdraw()">Запросить вывод</button>
        </div>
    </div>

    <!-- ======================================================
       МОДАЛЬНОЕ ОКНО: ПРОМОКОД
       ====================================================== -->
    <div id="promoModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Активация промокода</h3>
                <button class="close-btn" onclick="closeModal('promoModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Введите ваш секретный промокод</label>
                <input type="text" id="promoInput" class="input-field" placeholder="Например: BRAWL500" style="text-transform: uppercase;" />
            </div>
            <p style="font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-bottom: 12px;">
                Попробуйте промокоды: <b style="color: #FBBF24;">BRAWL500</b>, <b style="color: #FBBF24;">BONUS</b> или <b style="color: #FBBF24;">START</b>
            </p>
            <button class="submit-btn btn-amber" onclick="handlePromo()">Активировать</button>
        </div>
    </div>

    <!-- ======================================================
       ЛОГИКА ПРИЛОЖЕНИЯ (JAVASCRIPT)
       ====================================================== -->
    <script>
        // Состояние баланса и истории
        let currentBalance = 12450;
        let isBalanceHidden = false;

        let operations = [
            { id: 1, title: "Пополнение СБП", date: "Сегодня, 14:20", amount: "+ 500 ₽", type: "plus" },
            { id: 2, title: "Покупка Brawl Pass", date: "Вчера, 18:45", amount: "- 799 ₽", type: "minus" },
            { id: 3, title: "Промокод BRAWL500", date: "21 июля", amount: "+ 500 ₽", type: "plus" }
        ];

        // Рендер баланса
        function renderBalance() {
            const display = document.getElementById('balanceDisplay');
            if (isBalanceHidden) {
                display.textContent = "•••••• ₽";
            } else {
                display.textContent = currentBalance.toLocaleString('ru-RU') + " ₽";
            }
        }

        // Переключение видимости баланса
        function toggleBalance() {
            isBalanceHidden = !isBalanceHidden;
            document.getElementById('toggleBalanceBtn').textContent = isBalanceHidden ? "🔒" : "👁️";
            renderBalance();
        }

        // Рендер истории операций
        function renderOperations() {
            const list = document.getElementById('operationsList');
            list.innerHTML = operations.map(op => `
                <div class="op-item">
                    <div class="op-left">
                        <div class="op-icon ${op.type === 'plus' ? 'in' : 'out'}">
                            ${op.type === 'plus' ? '↓' : '↑'}
                        </div>
                        <div class="op-info">
                            <h5>${op.title}</h5>
                            <span>${op.date}</span>
                        </div>
                    </div>
                    <div class="op-amount ${op.type}">
                        ${op.amount}
                    </div>
                </div>
            `).join('');
        }

        // Уведомления (Toast)
        function showToast(text, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.style.background = isError ? "rgba(239, 68, 68, 0.95)" : "rgba(16, 185, 129, 0.95)";
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Управление модальными окнами
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // --- ЛОГИКА ПОПОЛНЕНИЯ ---
        function setTopupAmount(val) {
            document.getElementById('topupInput').value = val;
        }

        function handleTopup() {
            const val = parseInt(document.getElementById('topupInput').value);
            if (!val || val <= 0) {
                showToast("Введите корректную сумму!", true);
                return;
            }

            currentBalance += val;
            operations.unshift({
                id: Date.now(),
                title: "Пополнение баланса",
                date: "Только что",
                amount: `+ ${val.toLocaleString('ru-RU')} ₽`,
                type: "plus"
            });

            renderBalance();
            renderOperations();
            closeModal('topupModal');
            showToast(`Успешно пополнено на ${val} ₽!`);
        }

        // --- ЛОГИКА ВЫВОДА ---
        function handleWithdraw() {
            const target = document.getElementById('withdrawTarget').value.trim();
            const val = parseInt(document.getElementById('withdrawAmount').value);

            if (!target) {
                showToast("Укажите реквизиты для вывода!", true);
                return;
            }
            if (!val || val <= 0) {
                showToast("Введите корректную сумму!", true);
                return;
            }
            if (val > currentBalance) {
                showToast("Недостаточно средств на балансе!", true);
                return;
            }

            currentBalance -= val;
            operations.unshift({
                id: Date.now(),
                title: "Вывод средств",
                date: "Только что",
                amount: `- ${val.toLocaleString('ru-RU')} ₽`,
                type: "minus"
            });

            renderBalance();
            renderOperations();
            closeModal('withdrawModal');
            showToast(`Заявка на вывод ${val} ₽ создана!`);
        }

        // --- ЛОГИКА ПРОМОКОДОВ ---
        function handlePromo() {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            
            if (!code) {
                showToast("Введите промокод!", true);
                return;
            }

            let bonus = 0;
            if (code === 'BRAWL500' || code === 'START') bonus = 500;
            else if (code === 'BONUS') bonus = 1000;
            else if (code === 'PROMO100') bonus = 100;

            if (bonus > 0) {
                currentBalance += bonus;
                operations.unshift({
                    id: Date.now(),
                    title: `Промокод ${code}`,
                    date: "Только что",
                    amount: `+ ${bonus} ₽`,
                    type: "plus"
                });
                renderBalance();
                renderOperations();
                closeModal('promoModal');
                document.getElementById('promoInput').value = '';
                showToast(`Промокод активирован! +${bonus} ₽`);
            } else {
                showToast("Неверный или недействительный промокод!", true);
            }
        }

        // Покупка проходки
        function buyPass() {
            if (currentBalance < 799) {
                showToast("Недостаточно средств!", true);
                openModal('topupModal');
                return;
            }
            currentBalance -= 799;
            operations.unshift({
                id: Date.now(),
                title: "Покупка Brawl Pass Plus",
                date: "Только что",
                amount: "- 799 ₽",
                type: "minus"
            });
            renderBalance();
            renderOperations();
            showToast("Brawl Pass Plus успешно приобретен!");
        }

        // Первичная инициализация
        renderBalance();
        renderOperations();
    </script>
</body>
</html>

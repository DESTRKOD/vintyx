<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vintyx Store — Профиль</title>
    <style>
        /* ======================================================
                   ФОН ИЗ ОРИГИНАЛЬНОГО VINTYX SHOP
                   ====================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #FFFFFF;
            background: radial-gradient(ellipse at 20% 50%, rgba(91, 140, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(125, 216, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(102, 117, 255, 0.08) 0%, transparent 40%),
                linear-gradient(145deg, #0A0A1A 0%, #1A1A3E 30%, #2D1B69 70%, #1A1A3E 100%);
            background-attachment: fixed;
        }

        /* ======================================================
                   КОНТЕЙНЕР ПРОФИЛЯ
                   ====================================================== */
        .profile-screen {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 8px 0 20px;
        }

        /* ======================================================
                   БАЛАНСОВАЯ КАРТА — РАЗДЕЛЕНИЕ 35/65
                   ====================================================== */
        .balance-card {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(60, 80, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 28px;
            height: 190px;
            display: flex;
            background: #0A0A14;
        }

        /* ============================================
           ЛЕВАЯ ЧАСТЬ — 35% ЯРКОЕ СИНЕЕ СВЕЧЕНИЕ
           ============================================ */
        .balance-card .glow-section {
            width: 35%;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            background: #08081A;
            z-index: 1;
        }

        /* Яркое синее свечение с волнами */
        .balance-card .glow-section .glow-bg {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 90%, rgba(40, 120, 255, 0.9) 0%, transparent 55%),
                radial-gradient(ellipse at 30% 50%, rgba(80, 180, 255, 0.5) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 20%, rgba(30, 100, 240, 0.6) 0%, transparent 50%),
                linear-gradient(180deg, #08081A 0%, #0A0A2A 30%, #05051A 100%);
            z-index: 0;
            animation: waveGlow 3.5s ease-in-out infinite alternate;
        }

        @keyframes waveGlow {
            0% {
                opacity: 0.7;
                transform: scale(1) translateX(-5%);
                background:
                    radial-gradient(ellipse at 40% 90%, rgba(40, 120, 255, 0.9) 0%, transparent 55%),
                    radial-gradient(ellipse at 20% 50%, rgba(80, 180, 255, 0.5) 0%, transparent 40%),
                    radial-gradient(ellipse at 80% 20%, rgba(30, 100, 240, 0.6) 0%, transparent 50%);
            }
            50% {
                opacity: 1;
                transform: scale(1.05) translateX(3%);
                background:
                    radial-gradient(ellipse at 60% 80%, rgba(60, 160, 255, 1) 0%, transparent 50%),
                    radial-gradient(ellipse at 20% 40%, rgba(120, 200, 255, 0.6) 0%, transparent 35%),
                    radial-gradient(ellipse at 80% 30%, rgba(50, 120, 255, 0.7) 0%, transparent 45%);
            }
            100% {
                opacity: 0.8;
                transform: scale(0.98) translateX(-2%);
                background:
                    radial-gradient(ellipse at 30% 95%, rgba(35, 100, 240, 0.9) 0%, transparent 55%),
                    radial-gradient(ellipse at 70% 50%, rgba(90, 170, 255, 0.5) 0%, transparent 40%),
                    radial-gradient(ellipse at 40% 15%, rgba(25, 80, 220, 0.6) 0%, transparent 50%);
            }
        }

        /* Вторая волна для более сложного переливания */
        .balance-card .glow-section .glow-bg2 {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 70% 80%, rgba(80, 160, 255, 0.7) 0%, transparent 45%),
                radial-gradient(ellipse at 30% 20%, rgba(140, 200, 255, 0.4) 0%, transparent 40%);
            z-index: 0;
            animation: waveGlow2 4.5s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes waveGlow2 {
            0% {
                opacity: 0.4;
                transform: translateX(-8%) scale(1);
            }
            100% {
                opacity: 0.9;
                transform: translateX(8%) scale(1.08);
            }
        }

        /* Частицы */
        .balance-card .glow-section .particles {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .balance-card .glow-section .particles span {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(100, 200, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(80, 180, 255, 0.5);
            animation: floatParticle 4s infinite ease-in-out;
        }

        .balance-card .glow-section .particles span:nth-child(1) {
            left: 20%;
            top: 30%;
            animation-delay: 0s;
        }
        .balance-card .glow-section .particles span:nth-child(2) {
            left: 60%;
            top: 20%;
            animation-delay: 1.4s;
            width: 4px;
            height: 4px;
            opacity: 0.5;
        }
        .balance-card .glow-section .particles span:nth-child(3) {
            left: 30%;
            top: 70%;
            animation-delay: 2.8s;
        }
        .balance-card .glow-section .particles span:nth-child(4) {
            left: 70%;
            top: 65%;
            animation-delay: 0.9s;
            width: 2px;
            height: 2px;
            opacity: 0.3;
        }
        .balance-card .glow-section .particles span:nth-child(5) {
            left: 10%;
            top: 85%;
            animation-delay: 2s;
            width: 5px;
            height: 5px;
            opacity: 0.2;
        }

        @keyframes floatParticle {
            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-25px) scale(1.6);
                opacity: 0.9;
            }
        }

        /* ============================================
           РАЗДЕЛИТЕЛЬ В ВИДЕ МОЛНИИ
           ============================================ */
        .balance-card .lightning-divider {
            position: absolute;
            left: 35%;
            top: 0;
            width: 3px;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(180deg,
                    rgba(80, 180, 255, 0) 0%,
                    rgba(80, 180, 255, 0.9) 10%,
                    rgba(120, 220, 255, 1) 20%,
                    rgba(80, 180, 255, 0.8) 30%,
                    rgba(40, 120, 255, 1) 40%,
                    rgba(100, 200, 255, 0.9) 50%,
                    rgba(40, 120, 255, 1) 60%,
                    rgba(120, 220, 255, 0.8) 70%,
                    rgba(80, 180, 255, 0.9) 80%,
                    rgba(80, 180, 255, 0.5) 90%,
                    rgba(80, 180, 255, 0) 100%);
            animation: lightningPulse 1.2s ease-in-out infinite alternate;
            box-shadow: 0 0 20px rgba(80, 180, 255, 0.4), 0 0 40px rgba(80, 180, 255, 0.2);
        }

        /* Вторая линия для эффекта молнии */
        .balance-card .lightning-divider::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 10%;
            width: 7px;
            height: 15%;
            background: radial-gradient(ellipse at center, rgba(120, 220, 255, 0.6) 0%, transparent 70%);
            animation: lightningBranch 1.8s ease-in-out infinite alternate;
            filter: blur(2px);
        }

        .balance-card .lightning-divider::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 45%;
            width: 7px;
            height: 12%;
            background: radial-gradient(ellipse at center, rgba(80, 180, 255, 0.5) 0%, transparent 70%);
            animation: lightningBranch 2.2s ease-in-out infinite alternate-reverse;
            filter: blur(2px);
        }

        @keyframes lightningPulse {
            0% {
                opacity: 0.6;
                transform: scaleY(0.98);
            }
            50% {
                opacity: 1;
                transform: scaleY(1.02);
                box-shadow: 0 0 30px rgba(80, 180, 255, 0.6), 0 0 60px rgba(80, 180, 255, 0.3);
            }
            100% {
                opacity: 0.7;
                transform: scaleY(0.99);
            }
        }

        @keyframes lightningBranch {
            0% {
                opacity: 0.3;
                transform: scale(1) translateY(0);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.3) translateY(-5px);
            }
            100% {
                opacity: 0.4;
                transform: scale(0.8) translateY(5px);
            }
        }

        /* ============================================
           ПРАВАЯ ЧАСТЬ — 65% ЧЁРНАЯ
           ============================================ */
        .balance-card .content-section {
            flex: 1;
            padding: 28px 22px 28px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #0A0A14;
            position: relative;
            z-index: 1;
            min-height: 190px;
        }

        /* Тонкое синее свечение справа */
        .balance-card .content-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 0% 50%, rgba(40, 120, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 20%, rgba(60, 160, 255, 0.03) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .balance-card .content-section>* {
            position: relative;
            z-index: 1;
        }

        /* Аватарка в левом верхнем углу */
        .balance-card .content-section .avatar-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            flex-shrink: 0;
        }

        .balance-card .content-section .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .balance-card .content-section .avatar-wrap .fallback {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }

        /* Баланс — строго по центру */
        .balance-card .content-section .balance-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4px 0;
        }

        .balance-card .content-section .balance-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .balance-card .content-section .balance-amount {
            font-size: 3rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            line-height: 1;
            text-shadow: 0 0 40px rgba(80, 160, 255, 0.08);
        }

        .balance-card .content-section .balance-currency {
            font-size: 1.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
            margin-left: 4px;
        }

        /* Тонкая линия внизу карты */
        .balance-card .content-section .card-footer-line {
            margin-top: 6px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            flex-shrink: 0;
        }

        /* ======================================================
                   КНОПКИ БЫСТРЫХ ДЕЙСТВИЙ — РАВНЫЕ
                   ====================================================== */
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
        }

        .quick-actions .qa-btn {
            flex: 1;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0 6px;
            white-space: nowrap;
        }

        .quick-actions .qa-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.08);
        }

        .quick-actions .qa-btn svg {
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
        }

        /* ======================================================
                   ОПЕРАЦИИ
                   ====================================================== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-header .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: -0.2px;
        }

        .section-header .section-link {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section-header .section-link:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        .section-header .section-link svg {
            width: 14px;
            height: 14px;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 2;
            fill: none;
        }

        /* Список операций */
        .operations-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 32px;
        }

        .operation-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.15s ease;
            cursor: default;
        }

        .operation-item:active {
            background: rgba(255, 255, 255, 0.04);
        }

        .operation-item .op-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .operation-item .op-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.2);
        }

        .operation-item .op-info {
            flex: 1;
            min-width: 0;
        }

        .operation-item .op-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .operation-item .op-date {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            margin-top: 1px;
        }

        .operation-item .op-amount {
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFFFFF;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .operation-item .op-amount.negative {
            color: rgba(255, 255, 255, 0.5);
        }

        .operation-item .op-amount.positive {
            color: #4ADE80;
        }

        /* Пустое состояние */
        .operations-empty {
            text-align: center;
            padding: 28px 0 12px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.8rem;
        }

        /* ======================================================
                   ИНФОРМАЦИОННЫЙ БЛОК — ЦЕНТРИРОВАННЫЙ
                   ====================================================== */
        .info-block {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px 20px;
            padding: 16px 4px 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 8px;
            text-align: center;
        }

        .info-block .info-item {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
            letter-spacing: 0.2px;
            padding: 4px 0;
        }

        .info-block .info-item:hover {
            color: rgba(255, 255, 255, 0.4);
        }

        .info-block .info-item:active {
            opacity: 0.5;
        }

        /* ======================================================
                   АДАПТИВНОСТЬ
                   ====================================================== */
        @media (max-width: 420px) {
            .balance-card {
                border-radius: 28px;
                height: 170px;
            }

            .balance-card .content-section {
                padding: 20px 16px 20px 18px;
                min-height: 170px;
            }

            .balance-card .content-section .balance-amount {
                font-size: 2.4rem;
            }

            .quick-actions .qa-btn {
                height: 46px;
                font-size: 0.75rem;
                border-radius: 14px;
            }

            .quick-actions .qa-btn svg {
                width: 16px;
                height: 16px;
            }

            .operation-item {
                padding: 10px 12px;
            }

            .operation-item .op-icon {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
            }

            .operation-item .op-name {
                font-size: 0.8rem;
            }

            .info-block {
                gap: 4px 14px;
                padding: 14px 2px 4px;
            }

            .info-block .info-item {
                font-size: 0.65rem;
            }
        }

        @media (max-width: 360px) {
            .balance-card {
                height: 150px;
            }

            .balance-card .content-section {
                padding: 16px 12px 16px 14px;
                min-height: 150px;
            }

            .balance-card .content-section .balance-amount {
                font-size: 2rem;
            }

            .quick-actions {
                gap: 6px;
            }

            .quick-actions .qa-btn {
                font-size: 0.65rem;
                height: 40px;
                padding: 0 4px;
            }

            .quick-actions .qa-btn svg {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-screen">

        <!-- ============================================
        БАЛАНСОВАЯ КАРТА — 35% СИНИЙ / 65% ЧЁРНЫЙ
        ============================================ -->
        <div class="balance-card">

            <!-- ЛЕВАЯ ЧАСТЬ — 35% ЯРКОЕ СИНЕЕ СВЕЧЕНИЕ -->
            <div class="glow-section">
                <div class="glow-bg"></div>
                <div class="glow-bg2"></div>
                <div class="particles">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <!-- РАЗДЕЛИТЕЛЬ В ВИДЕ МОЛНИИ -->
            <div class="lightning-divider"></div>

            <!-- ПРАВАЯ ЧАСТЬ — 65% ЧЁРНАЯ -->
            <div class="content-section">

                <!-- Аватарка в левом верхнем углу -->
                <div class="avatar-wrap">
                    <span class="fallback">V</span>
                </div>

                <!-- Баланс — строго по центру -->
                <div class="balance-center">
                    <span class="balance-label">Баланс</span>
                    <div>
                        <span class="balance-amount">1 488</span>
                        <span class="balance-currency">₽</span>
                    </div>
                </div>

                <!-- Декоративная линия -->
                <div class="card-footer-line"></div>
            </div>
        </div>

        <!-- ============================================
        БЫСТРЫЕ ДЕЙСТВИЯ — 3 РАВНЫЕ КНОПКИ
        ============================================ -->
        <div class="quick-actions">
            <button class="qa-btn" onclick="alert('Вывод')">
                <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                Вывод
            </button>
            <button class="qa-btn" onclick="alert('Пополнить')">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                Пополнить
            </button>
            <button class="qa-btn" onclick="alert('Промокод')">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Промокод
            </button>
        </div>

        <!-- ============================================
        ОПЕРАЦИИ
        ============================================ -->
        <div class="section-header">
            <span class="section-title">Мои операции</span>
            <span class="section-link" onclick="alert('Все операции')">
                Все операции
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </span>
        </div>

        <div class="operations-list">
            <!-- Операция 1 -->
            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">🎮</div>
                    <div class="op-info">
                        <div class="op-name">Brawl Pass</div>
                        <div class="op-date">Сегодня, 14:32</div>
                    </div>
                </div>
                <span class="op-amount negative">−149 ₽</span>
            </div>

            <!-- Операция 2 -->
            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">⚡</div>
                    <div class="op-info">
                        <div class="op-name">Гемы</div>
                        <div class="op-date">Вчера, 09:15</div>
                    </div>
                </div>
                <span class="op-amount negative">−299 ₽</span>
            </div>

            <!-- Операция 3 -->
            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">💎</div>
                    <div class="op-info">
                        <div class="op-name">Пополнение</div>
                        <div class="op-date">12 мар, 18:00</div>
                    </div>
                </div>
                <span class="op-amount positive">+500 ₽</span>
            </div>

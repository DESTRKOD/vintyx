<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vintyx Store — Профиль</title>
    <style>
        /* ======================================================
                   БАЗА
                   ====================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #FFFFFF;
            background: radial-gradient(ellipse at 20% 50%, rgba(91, 140, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(125, 216, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(102, 117, 255, 0.08) 0%, transparent 40%),
                linear-gradient(145deg, #0A0A1A 0%, #1A1A3E 30%, #2D1B69 70%, #1A1A3E 100%);
            background-attachment: fixed;
        }

        /* ======================================================
                   КОНТЕЙНЕР ПРОФИЛЯ
                   ====================================================== */
        .profile-screen {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 8px 0 20px;
        }

        /* ======================================================
                   ЗАГОЛОВОК "ПРОФИЛЬ"
                   ====================================================== */
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .profile-header .profile-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
        }

        /* ======================================================
                   БАЛАНСОВАЯ КАРТА — БЕЗ ЧЁРНОГО ФОНА
                   ====================================================== */
        .balance-card {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(60, 80, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 28px;
            height: 200px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        /* Фоновое изображение на всю карту */
        .balance-card .card-bg-image {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 32px;
        }

        /* Лёгкая накладка для читаемости */
        .balance-card .card-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 32px;
        }

        /* Контент поверх изображения */
        .balance-card>*:not(.card-bg-image):not(.card-overlay) {
            position: relative;
            z-index: 2;
        }

        /* Аватарка в левом верхнем углу */
        .balance-card .avatar-wrap {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
            flex-shrink: 0;
            z-index: 3;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .balance-card .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .balance-card .avatar-wrap .fallback {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
        }

        /* Баланс — строго по центру, поднят выше */
        .balance-card .balance-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2;
            position: relative;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
            margin-top: -20px;
        }

        .balance-card .balance-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .balance-card .balance-amount {
            font-size: 3.8rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .balance-card .balance-currency {
            font-size: 1.4rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.3);
            margin-left: 4px;
        }

        /* Убрал декоративную линию */

        /* ======================================================
                   ОСТАЛЬНЫЕ СТИЛИ (без изменений)
                   ====================================================== */
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
        }

        .quick-actions .qa-btn {
            flex: 1;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0 6px;
            white-space: nowrap;
        }

        .quick-actions .qa-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.08);
        }

        .quick-actions .qa-btn svg {
            width: 18px;
            height: 18px;
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-header .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: -0.2px;
        }

        .section-header .section-link {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section-header .section-link:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        .section-header .section-link svg {
            width: 14px;
            height: 14px;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 2;
            fill: none;
        }

        .operations-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 32px;
        }

        .operation-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.15s ease;
            cursor: default;
        }

        .operation-item:active {
            background: rgba(255, 255, 255, 0.04);
        }

        .operation-item .op-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .operation-item .op-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.2);
        }

        .operation-item .op-info {
            flex: 1;
            min-width: 0;
        }

        .operation-item .op-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .operation-item .op-date {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            margin-top: 1px;
        }

        .operation-item .op-amount {
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFFFFF;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .operation-item .op-amount.negative {
            color: rgba(255, 255, 255, 0.5);
        }

        .operation-item .op-amount.positive {
            color: #4ADE80;
        }

        .operations-empty {
            text-align: center;
            padding: 28px 0 12px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.8rem;
        }

        .info-block {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px 20px;
            padding: 16px 4px 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 8px;
            text-align: center;
        }

        .info-block .info-item {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
            letter-spacing: 0.2px;
            padding: 4px 0;
        }

        .info-block .info-item:hover {
            color: rgba(255, 255, 255, 0.4);
        }

        .info-block .info-item:active {
            opacity: 0.5;
        }

        /* ======================================================
                   АДАПТИВНОСТЬ
                   ====================================================== */
        @media (max-width: 420px) {
            .balance-card {
                border-radius: 28px;
                height: 180px;
            }

            .balance-card .avatar-wrap {
                top: 16px;
                left: 16px;
                width: 42px;
                height: 42px;
            }

            .balance-card .balance-label {
                font-size: 0.8rem;
            }

            .balance-card .balance-amount {
                font-size: 3.2rem;
            }

            .profile-header .profile-title {
                font-size: 1.4rem;
            }

            .quick-actions .qa-btn {
                height: 46px;
                font-size: 0.75rem;
                border-radius: 14px;
            }

            .quick-actions .qa-btn svg {
                width: 16px;
                height: 16px;
            }

            .operation-item {
                padding: 10px 12px;
            }

            .operation-item .op-icon {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
            }

            .operation-item .op-name {
                font-size: 0.8rem;
            }

            .info-block {
                gap: 4px 14px;
                padding: 14px 2px 4px;
            }

            .info-block .info-item {
                font-size: 0.65rem;
            }
        }

        @media (max-width: 360px) {
            .balance-card {
                height: 160px;
                border-radius: 24px;
            }

            .balance-card .avatar-wrap {
                top: 14px;
                left: 14px;
                width: 36px;
                height: 36px;
            }

            .balance-card .avatar-wrap .fallback {
                font-size: 0.9rem;
            }

            .balance-card .balance-label {
                font-size: 0.7rem;
            }

            .balance-card .balance-amount {
                font-size: 2.6rem;
            }

            .profile-header .profile-title {
                font-size: 1.2rem;
            }

            .quick-actions {
                gap: 6px;
            }

            .quick-actions .qa-btn {
                font-size: 0.65rem;
                height: 40px;
                padding: 0 4px;
            }

            .quick-actions .qa-btn svg {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-screen">

        <!-- ============================================
        ЗАГОЛОВОК "ПРОФИЛЬ"
        ============================================ -->
        <div class="profile-header">
            <span class="profile-title">ПРОФИЛЬ</span>
        </div>

        <!-- ============================================
        БАЛАНСОВАЯ КАРТА
        ============================================ -->
        <div class="balance-card">

            <!-- Фоновое изображение -->
            <img class="card-bg-image"
                 src="https://i.imgur.com/BgiOzRI.png"
                 alt="Card background"
                 loading="lazy" />

            <!-- Лёгкая накладка -->
            <div class="card-overlay"></div>

            <!-- Аватарка в левом верхнем углу -->
            <div class="avatar-wrap">
                <span class="fallback">V</span>
            </div>

            <!-- Баланс — по центру, поднят выше -->
            <div class="balance-center">
                <span class="balance-label">Баланс</span>
                <div>
                    <span class="balance-amount">1 488</span>
                    <span class="balance-currency">₽</span>
                </div>
            </div>
        </div>

        <!-- ============================================
        БЫСТРЫЕ ДЕЙСТВИЯ
        ============================================ -->
        <div class="quick-actions">
            <button class="qa-btn" onclick="alert('Вывод')">
                <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                Вывод
            </button>
            <button class="qa-btn" onclick="alert('Пополнить')">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                Пополнить
            </button>
            <button class="qa-btn" onclick="alert('Промокод')">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Промокод
            </button>
        </div>

        <!-- ============================================
        ОПЕРАЦИИ
        ============================================ -->
        <div class="section-header">
            <span class="section-title">Мои операции</span>
            <span class="section-link" onclick="alert('Все операции')">
                Все операции
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </span>
        </div>

        <div class="operations-list">
            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">🎮</div>
                    <div class="op-info">
                        <div class="op-name">Brawl Pass</div>
                        <div class="op-date">Сегодня, 14:32</div>
                    </div>
                </div>
                <span class="op-amount negative">−149 ₽</span>
            </div>

            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">⚡</div>
                    <div class="op-info">
                        <div class="op-name">Гемы</div>
                        <div class="op-date">Вчера, 09:15</div>
                    </div>
                </div>
                <span class="op-amount negative">−299 ₽</span>
            </div>

            <div class="operation-item">
                <div class="op-left">
                    <div class="op-icon">💎</div>
                    <div class="op-info">
                        <div class="op-name">Пополнение</div>
                        <div class="op-date">12 мар, 18:00</div>
                    </div>
                </div>
                <span class="op-amount positive">+500 ₽</span>
            </div>
        </div>

        <!-- ============================================
        ИНФОРМАЦИОННЫЙ БЛОК
        ============================================ -->
        <div class="info-block">
            <span class="info-item" onclick="alert('О магазине')">О магазине</span>
            <span class="info-item" onclick="alert('Поддержка')">Поддержка</span>
            <span class="info-item" onclick="alert('Условия')">Условия</span>
            <span class="info-item" onclick="alert('Политика конфиденциальности')">Политика</span>
        </div>

    </div>

</body>
</html>

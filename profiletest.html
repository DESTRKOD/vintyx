<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vintyx Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            background: #0A0A0F;
            font-family: -apple-system, 'Segoe UI', 'Roboto', system-ui, sans-serif;
            height: 100%;
            overflow: hidden;
            color: #FFFFFF;
        }
        .page {
            display: none;
            background: radial-gradient(ellipse at 20% 50%, rgba(91, 140, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(125, 216, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(102, 117, 255, 0.08) 0%, transparent 40%),
                linear-gradient(145deg, #0A0A1A 0%, #1A1A3E 30%, #2D1B69 70%, #1A1A3E 100%);
            background-attachment: fixed;
            height: 100%;
            overflow-y: auto;
            padding: 20px 20px 100px;
        }
        .page.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container {
            max-width: 440px;
            margin: 0 auto;
        }

        /* Хедер профиля */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-title {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }
        .header-user {
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Карточка баланса */
        .balance-card {
            position: relative;
            height: 170px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        /* Круглая аватарка слева */
        .avatar-circle {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6675FF, #7DD8FF);
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFF;
            box-shadow: 0 8px 16px rgba(91, 140, 255, 0.3);
        }
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .balance-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .balance-value {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7DD8FF 0%, #6675FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Кнопки действий */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        .action-btn {
            height: 54px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .action-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.09);
        }

        /* Список операций */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .see-all-btn {
            font-size: 0.75rem;
            color: #3B82F6;
            background: none;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .tx-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .tx-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .tx-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tx-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .tx-title {
            font-size: 0.85rem;
            font-weight: 600;
        }
        .tx-date {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
        }
        .tx-amount {
            font-size: 0.85rem;
            font-weight: 700;
        }
        .tx-amount.positive { color: #10B981; }
        .tx-amount.negative { color: rgba(255, 255, 255, 0.7); }

        /* Островок навигации на 3 пункта */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 50, 0.6);
            backdrop-filter: blur(24px);
            border-radius: 50px;
            padding: 6px 12px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .nav-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.65rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .nav-btn.active {
            background: rgba(91, 140, 255, 0.25);
            color: #FFFFFF;
            border: 1px solid rgba(91, 140, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- Главная страница профиля -->
    <div id="pageProfile" class="page active">
        <div class="container">
            <div class="header">
                <div class="header-title">ПРОФИЛЬ</div>
                <div class="header-user" id="headerName">Пользователь</div>
            </div>

            <div class="balance-card">
                <div class="avatar-circle" id="avatarBox">
                    <span id="avatarLetter">U</span>
                </div>
                <div class="balance-label">Баланс</div>
                <div class="balance-value"><span id="balanceText">1 488</span> ₽</div>
            </div>

            <div class="actions-grid">
                <button class="action-btn" onclick="openPage('pageWithdraw')">
                    <span>↗ Вывод</span>
                </button>
                <button class="action-btn" onclick="openPage('pageTopUp')">
                    <span>+ Пополнить</span>
                </button>
                <button class="action-btn" onclick="alert('Промокод')">
                    <span>🎟 Промокод</span>
                </button>
            </div>

            <div class="section-header">
                <div class="section-title">Операции</div>
                <button class="see-all-btn" onclick="openPage('pageAllOps')">Смотреть все →</button>
            </div>

            <div class="tx-list" id="txList">
                <div class="tx-item">
                    <div class="tx-left">
                        <div class="tx-icon">🎮</div>
                        <div>
                            <div class="tx-title">Brawl Pass</div>
                            <div class="tx-date">Сегодня, 14:32</div>
                        </div>
                    </div>
                    <div class="tx-amount negative">−149 ₽</div>
                </div>
                <div class="tx-item">
                    <div class="tx-left">
                        <div class="tx-icon">⚡</div>
                        <div>
                            <div class="tx-title">Гемы</div>
                            <div class="tx-date">Вчера, 09:15</div>
                        </div>
                    </div>
                    <div class="tx-amount negative">−299 ₽</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Полный экран Всех Операций -->
    <div id="pageAllOps" class="page">
        <div class="container">
            <button onclick="openPage('pageProfile')" style="background:none;border:none;color:#3B82F6;margin-bottom:16px;cursor:pointer;">← Назад в профиль</button>
            <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:20px;">Все операции</h2>
            <div class="tx-list">
                <div class="tx-item">
                    <div class="tx-left">
                        <div class="tx-icon">🎮</div>
                        <div>
                            <div class="tx-title">Brawl Pass</div>
                            <div class="tx-date">Сегодня, 14:32</div>
                        </div>
                    </div>
                    <div class="tx-amount negative">−149 ₽</div>
                </div>
                <div class="tx-item">
                    <div class="tx-left">
                        <div class="tx-icon">💎</div>
                        <div>
                            <div class="tx-title">Пополнение СБП</div>
                            <div class="tx-date">12 мар, 18:00</div>
                        </div>
                    </div>
                    <div class="tx-amount positive">+500 ₽</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Островок навигации из 3 пунктов -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="openPage('pageProfile')">Профиль</button>
        <button class="nav-btn" onclick="alert('Главная')">Главная</button>
        <button class="nav-btn" onclick="alert('Корзина')">Корзина</button>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                const name = user.first_name || 'Игрок';
                document.getElementById('headerName').textContent = name;
                if (user.photo_url) {
                    document.getElementById('avatarBox').innerHTML = `<img src="${user.photo_url}">`;
                } else {
                    document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();
                }
            }
        }

        function openPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
